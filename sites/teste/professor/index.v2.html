<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – Professor | SGE v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }

    @keyframes shimmer {
      0%   { background-position: -400% 0; }
      100% { background-position:  400% 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 400% 100%;
      animation: shimmer 1.6s infinite;
      border-radius: 0.375rem;
      color: transparent !important;
    }
    .skeleton * { visibility: hidden; }

    @keyframes slideInRight {
      from { transform: translateX(110%); opacity: 0; }
      to   { transform: translateX(0);    opacity: 1; }
    }
    .toast {
      display: flex; align-items: center; gap: 0.625rem;
      padding: 0.75rem 1rem; border-radius: 0.5rem;
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
      font-size: 0.875rem; min-width: 260px; max-width: 380px;
      animation: slideInRight .25s ease;
      transition: opacity .25s ease, transform .25s ease;
    }
    .toast.success { background:#ecfdf5; border-left:4px solid #10b981; color:#065f46; }
    .toast.error   { background:#fef2f2; border-left:4px solid #ef4444; color:#991b1b; }
    .toast.warning { background:#fffbeb; border-left:4px solid #f59e0b; color:#92400e; }
    .toast.info    { background:#eff6ff; border-left:4px solid #3b82f6; color:#1e40af; }

    #sidebar { transition: transform .3s cubic-bezier(.4,0,.2,1); }

    .stat-card { transition: transform .18s ease, box-shadow .18s ease; }
    .stat-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.09); }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #f8fafc; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }

    .notif-dot {
      position: absolute; top: 2px; right: 2px;
      width: 8px; height: 8px; border-radius: 50%;
      background: #ef4444; border: 2px solid #fff;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

<!-- ── Loading Overlay ────────────────────────────────────────────────── -->
<div id="loadingOverlay" class="fixed inset-0 z-50 bg-white flex flex-col items-center justify-center gap-3">
  <div class="w-11 h-11 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
  <p class="text-sm text-slate-400 font-medium">Verificando sessão…</p>
</div>

<!-- ── Layout Shell ───────────────────────────────────────────────────── -->
<div class="flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside id="sidebar"
    class="fixed inset-y-0 left-0 z-40 w-64 bg-slate-900 flex flex-col
           -translate-x-full lg:translate-x-0 lg:static lg:inset-auto lg:flex-shrink-0">

    <!-- Brand -->
    <div class="flex items-center gap-3 px-5 py-4 border-b border-slate-700/60">
      <div class="w-9 h-9 bg-blue-500 rounded-xl flex items-center justify-center flex-shrink-0">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13
               C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477
               14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477
               18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
        </svg>
      </div>
      <div class="leading-none">
        <p class="text-white font-bold text-sm">SGE</p>
        <p class="text-slate-400 text-xs mt-0.5">Área do Professor</p>
      </div>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-3 py-3 space-y-0.5 overflow-y-auto">
      <a href="#" class="nav-item active-nav flex items-center gap-3 px-3 py-2.5 rounded-lg
         bg-blue-600 text-white text-sm font-medium" data-section="dashboard">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1
               1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1
               1 0 001 1m-6 0h6"/>
        </svg>
        Dashboard
      </a>
      <a href="chamada.html" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg
         text-slate-400 hover:bg-slate-800 hover:text-white text-sm font-medium transition-colors"
         data-section="chamada">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0
               00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2
               0 012 2m-6 9l2 2 4-4"/>
        </svg>
        Chamada
      </a>
      <a href="bilhetes.html" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg
         text-slate-400 hover:bg-slate-800 hover:text-white text-sm font-medium transition-colors"
         data-section="bilhetes">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2
               0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
        Bilhetes
      </a>
      <a href="alunos.html" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg
         text-slate-400 hover:bg-slate-800 hover:text-white text-sm font-medium transition-colors"
         data-section="alunos">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857
               M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002
               5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014
               0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
        </svg>
        Alunos
      </a>
      <a href="notas.html" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg
         text-slate-400 hover:bg-slate-800 hover:text-white text-sm font-medium transition-colors"
         data-section="notas">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2
               2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2
               2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        Notas
      </a>
      <a href="horarios.html" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg
         text-slate-400 hover:bg-slate-800 hover:text-white text-sm font-medium transition-colors"
         data-section="horarios">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2
               2 0 002 2z"/>
        </svg>
        Horários
      </a>
    </nav>

    <!-- Bottom: Profile + Logout -->
    <div class="px-3 py-3 border-t border-slate-700/60 space-y-0.5">
      <a href="perfil.html"
        class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400
               hover:bg-slate-800 hover:text-white text-sm font-medium transition-colors">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        Meu Perfil
      </a>
      <button id="btnSair"
        class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400
               hover:bg-red-900/40 hover:text-red-400 text-sm font-medium transition-colors">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0
               013-3h4a3 3 0 013 3v1"/>
        </svg>
        Sair
      </button>
    </div>
  </aside>

  <!-- Sidebar mobile overlay -->
  <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>

  <!-- ── Main ──────────────────────────────────────────────────────────── -->
  <div class="flex-1 flex flex-col overflow-hidden min-w-0">

    <!-- Header -->
    <header class="flex-shrink-0 bg-white border-b border-slate-200 px-4 lg:px-6 py-3
                   flex items-center gap-3">
      <button id="btnToggleSidebar"
        class="lg:hidden p-2 rounded-lg hover:bg-slate-100 text-slate-500 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

      <div class="flex-1 min-w-0">
        <h1 class="text-sm font-semibold text-slate-800">Dashboard</h1>
        <p id="headerDate" class="text-xs text-slate-400"></p>
      </div>

      <div class="flex items-center gap-2">
        <!-- Bell -->
        <button id="btnNotificacoes"
          class="relative p-2 rounded-lg hover:bg-slate-100 text-slate-500 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0
                 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0
                 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
          </svg>
          <span id="notifBadge" class="notif-dot hidden"></span>
        </button>

        <!-- Avatar + name -->
        <div class="flex items-center gap-2.5 pl-2 border-l border-slate-200">
          <div id="userAvatar"
            class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center
                   text-white text-xs font-bold flex-shrink-0 skeleton">
          </div>
          <div class="hidden sm:block leading-none">
            <p id="userNameHeader"
              class="text-sm font-medium text-slate-700 skeleton w-20 h-3.5 rounded">&nbsp;</p>
            <p class="text-xs text-slate-400 mt-1">Professor</p>
          </div>
        </div>
      </div>
    </header>

    <!-- Scrollable content -->
    <main class="flex-1 overflow-y-auto p-4 lg:p-6 space-y-5">

      <!-- Welcome banner -->
      <div class="bg-gradient-to-br from-blue-600 to-blue-700 rounded-2xl p-5 lg:p-6 text-white
                  flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <p class="text-blue-200 text-sm">Bem-vindo de volta,</p>
          <h2 id="welcomeName" class="text-xl lg:text-2xl font-bold mt-0.5">…</h2>
          <p id="welcomeDate" class="text-blue-200 text-sm mt-1"></p>
        </div>
        <div class="flex-shrink-0 hidden sm:block opacity-20">
          <svg class="w-16 h-16" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
          </svg>
        </div>
      </div>

      <!-- Stat cards -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 lg:gap-4">

        <div class="stat-card bg-white rounded-xl p-4 border border-slate-200 shadow-sm">
          <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center mb-3">
            <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3
                   6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168
                   5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477
                   18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
            </svg>
          </div>
          <p id="statAulas" class="text-2xl font-bold text-slate-800">—</p>
          <p class="text-xs text-slate-500 mt-0.5 font-medium">Aulas Hoje</p>
        </div>

        <div class="stat-card bg-white rounded-xl p-4 border border-slate-200 shadow-sm">
          <div class="w-10 h-10 bg-emerald-50 rounded-xl flex items-center justify-center mb-3">
            <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0
                   0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2
                   2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
            </svg>
          </div>
          <p id="statFreq" class="text-2xl font-bold text-slate-800">—</p>
          <p class="text-xs text-slate-500 mt-0.5 font-medium">Freq. Média</p>
        </div>

        <div class="stat-card bg-white rounded-xl p-4 border border-slate-200 shadow-sm">
          <div class="w-10 h-10 bg-amber-50 rounded-xl flex items-center justify-center mb-3">
            <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732
                   4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
          </div>
          <p id="statFaltas" class="text-2xl font-bold text-slate-800">—</p>
          <p class="text-xs text-slate-500 mt-0.5 font-medium">Faltas (24h)</p>
        </div>

        <div class="stat-card bg-white rounded-xl p-4 border border-slate-200 shadow-sm">
          <div class="w-10 h-10 bg-violet-50 rounded-xl flex items-center justify-center mb-3">
            <svg class="w-5 h-5 text-violet-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2
                   0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
          </div>
          <p id="statBilhetes" class="text-2xl font-bold text-slate-800">—</p>
          <p class="text-xs text-slate-500 mt-0.5 font-medium">Bilhetes Enviados</p>
        </div>

      </div>

      <!-- Turmas + Atividade Recente -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 lg:gap-5">

        <!-- Minhas Turmas -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="flex items-center justify-between px-5 py-3.5 border-b border-slate-100">
            <h3 class="text-sm font-semibold text-slate-700">Minhas Turmas</h3>
            <span id="turmasCount"
              class="text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full font-medium">—</span>
          </div>
          <div id="turmasList">
            <!-- Skeleton rows -->
            <div class="px-5 py-3 flex items-center gap-3">
              <div class="w-9 h-9 skeleton rounded-lg flex-shrink-0"></div>
              <div class="flex-1 space-y-2">
                <div class="h-3 skeleton rounded w-3/4"></div>
                <div class="h-2.5 skeleton rounded w-1/2"></div>
              </div>
            </div>
            <div class="px-5 py-3 flex items-center gap-3 border-t border-slate-50">
              <div class="w-9 h-9 skeleton rounded-lg flex-shrink-0"></div>
              <div class="flex-1 space-y-2">
                <div class="h-3 skeleton rounded w-2/3"></div>
                <div class="h-2.5 skeleton rounded w-2/5"></div>
              </div>
            </div>
            <div class="px-5 py-3 flex items-center gap-3 border-t border-slate-50">
              <div class="w-9 h-9 skeleton rounded-lg flex-shrink-0"></div>
              <div class="flex-1 space-y-2">
                <div class="h-3 skeleton rounded w-4/5"></div>
                <div class="h-2.5 skeleton rounded w-1/3"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Atividade Recente -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="flex items-center justify-between px-5 py-3.5 border-b border-slate-100">
            <h3 class="text-sm font-semibold text-slate-700">Atividade Recente</h3>
          </div>
          <div id="atividadeList">
            <!-- Skeleton rows -->
            <div class="px-5 py-3 flex items-center gap-3">
              <div class="w-8 h-8 skeleton rounded-full flex-shrink-0"></div>
              <div class="flex-1 space-y-2">
                <div class="h-3 skeleton rounded w-4/5"></div>
                <div class="h-2.5 skeleton rounded w-2/5"></div>
              </div>
            </div>
            <div class="px-5 py-3 flex items-center gap-3 border-t border-slate-50">
              <div class="w-8 h-8 skeleton rounded-full flex-shrink-0"></div>
              <div class="flex-1 space-y-2">
                <div class="h-3 skeleton rounded w-3/5"></div>
                <div class="h-2.5 skeleton rounded w-1/3"></div>
              </div>
            </div>
            <div class="px-5 py-3 flex items-center gap-3 border-t border-slate-50">
              <div class="w-8 h-8 skeleton rounded-full flex-shrink-0"></div>
              <div class="flex-1 space-y-2">
                <div class="h-3 skeleton rounded w-2/3"></div>
                <div class="h-2.5 skeleton rounded w-2/6"></div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>

<!-- Toast Container -->
<div id="toastContainer"
  class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none">
</div>

<script type="module" src="./js/dashboard-professor.v2.js"></script>
</body>
</html>
