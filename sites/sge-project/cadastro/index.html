<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Criar Conta — SGE v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              bg: "#0f1115",
              surface: "#181b21",
              border: "#2a2e35",
              primary: "#f0a500",
              primaryHover: "#d49200",
              text: "#e6e9ed",
              muted: "#8b949e",
              danger: "#f43f5e",
              success: "#22c55e",
            },
            fontFamily: {
              sans: ["DM Sans", "sans-serif"],
              display: ["Syne", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      body { background: #0f1115; color: #e6e9ed; font-family: "DM Sans", sans-serif; }
      .field-err { display: none; color: #f43f5e; font-size: 0.78rem; margin-top: 0.25rem; }
      .field-err.show { display: block; }
      .toast-wrap { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; pointer-events: none; }
      .toast { padding: 0.75rem 1.25rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 500; min-width: 220px; animation: slideIn 0.25s ease; pointer-events: auto; }
      .toast.ok  { background: #16632e; border: 1px solid #22c55e; color: #d1fae5; }
      .toast.err { background: #6b1226; border: 1px solid #f43f5e; color: #ffe4e6; }
      @keyframes slideIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
      .role-card { border: 2px solid #2a2e35; border-radius: 1rem; padding: 1.5rem; cursor: pointer; transition: all 0.2s; text-align: center; background: #181b21; }
      .role-card:hover, .role-card.selected { border-color: #f0a500; background: rgba(240,165,0,0.06); }
      .role-card.selected .role-check { display: flex; }
      .role-check { display: none; width:20px; height:20px; border-radius:50%; background:#f0a500; color:#0f1115; font-size:12px; align-items:center; justify-content:center; position:absolute; top:10px; right:10px; font-weight:700; }
      .step { display: none; }
      .step.active { display: block; }
      .input-base { width:100%; padding:0.625rem 1rem; background:#0f1115; border:1px solid #2a2e35; border-radius:0.5rem; color:#e6e9ed; font-size:0.875rem; transition:border 0.2s; }
      .input-base:focus { outline:none; border-color:#f0a500; box-shadow:0 0 0 2px rgba(240,165,0,0.15); }
      .input-base.invalid { border-color:#f43f5e; }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center px-4 py-10">

    <div class="w-full max-w-lg">
      <div class="text-center mb-8">
        <a href="../index.html"><img src="../assets/img/logo.png" alt="SGE" class="h-10 w-auto object-contain mx-auto mb-4" onerror="this.style.display='none'" /></a>
        <h1 class="font-display text-2xl font-bold text-primary">Criar Conta</h1>
        <p class="text-muted text-sm mt-1" id="step-subtitle">Escolha seu perfil de acesso</p>
      </div>

      <div class="bg-surface border border-border rounded-2xl p-8 shadow-2xl">

        <!-- Step 1: Role selection -->
        <div class="step active" id="step-role">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
            <div class="role-card relative" data-role="professor">
              <span class="role-check">✓</span>
              <div class="text-3xl mb-2">👨‍🏫</div>
              <p class="font-semibold text-sm text-text">Professor</p>
              <p class="text-xs text-muted mt-1">Aprovação em 24h</p>
            </div>
            <div class="role-card relative" data-role="responsavel">
              <span class="role-check">✓</span>
              <div class="text-3xl mb-2">👨‍👩‍👧</div>
              <p class="font-semibold text-sm text-text">Responsável</p>
              <p class="text-xs text-muted mt-1">Acesso imediato</p>
            </div>
            <div class="role-card relative" data-role="diretor">
              <span class="role-check">✓</span>
              <div class="text-3xl mb-2">👔</div>
              <p class="font-semibold text-sm text-text">Diretor</p>
              <p class="text-xs text-muted mt-1">Contato admin</p>
            </div>
          </div>
          <p class="field-err show text-center" id="err-role"></p>
          <button id="btn-next" type="button" class="w-full py-3 bg-primary hover:bg-primaryHover text-bg font-bold rounded-xl text-sm transition mt-2">Continuar →</button>
        </div>

        <!-- Step 2: Unified form -->
        <div class="step" id="step-form">
          <div class="flex items-center gap-2 mb-5 text-sm text-muted cursor-pointer hover:text-primary transition" id="btn-back">
            <span>←</span><span>Voltar</span>
            <span class="ml-auto text-primary font-semibold" id="role-badge"></span>
          </div>

          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-1.5">Nome Completo</label>
              <input type="text" id="nome" autocomplete="name" placeholder="Seu nome completo" class="input-base" />
              <p class="field-err" id="err-nome"></p>
            </div>

            <div>
              <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-1.5">E-mail</label>
              <input type="email" id="email" autocomplete="email" placeholder="seu@email.com" class="input-base" />
              <p class="field-err" id="err-email"></p>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-1.5">CPF</label>
                <input type="text" id="cpf" autocomplete="off" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" class="input-base" />
                <p class="field-err" id="err-cpf"></p>
              </div>
              <div>
                <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-1.5">Telefone</label>
                <input type="tel" id="telefone" autocomplete="tel" placeholder="(00) 00000-0000" maxlength="15" class="input-base" />
              </div>
            </div>

            <div>
              <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-1.5">Senha</label>
              <input type="password" id="senha" autocomplete="new-password" placeholder="Mínimo 8 caracteres" class="input-base" />
              <p class="field-err" id="err-senha"></p>
            </div>

            <div id="wrap-matricula" class="hidden">
              <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-1.5">Matrícula do Aluno</label>
              <input type="text" id="matricula" autocomplete="off" placeholder="Ex: 2024001" class="input-base" />
              <p class="field-err" id="err-matricula"></p>
            </div>

            <button id="btn-submit" type="button" class="w-full py-3 bg-primary hover:bg-primaryHover text-bg font-bold rounded-xl text-sm transition flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed mt-2">
              <span id="btn-label">Criar Conta</span>
              <svg id="btn-spin" class="hidden animate-spin h-4 w-4 text-bg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path></svg>
            </button>
          </div>
        </div>

      </div>

      <p class="text-center text-muted text-xs mt-5">
        Já tem conta? <a href="../auth/login.html" class="text-primary hover:underline font-medium">Fazer login</a>
      </p>
    </div>

    <div id="toast-container" class="toast-wrap"></div>

    <script type="module" src="./js/wizard.js"></script>
    <script>
      const cpfInput = document.getElementById("cpf");
      cpfInput?.addEventListener("input", function () {
        let v = this.value.replace(/\D/g, "").slice(0, 11);
        v = v.replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d)/, "$1.$2").replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        this.value = v;
      });
      const telInput = document.getElementById("telefone");
      telInput?.addEventListener("input", function () {
        let v = this.value.replace(/\D/g, "").slice(0, 11);
        v = v.replace(/(\d{2})(\d)/, "($1) $2").replace(/(\d{5})(\d)/, "$1-$2");
        this.value = v;
      });
    </script>
  </body>
</html>
