<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGE — Cadastro</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      background: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      color: #1e293b;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 40px 36px;
      width: 100%;
      max-width: 440px;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1e40af;
      letter-spacing: -0.5px;
    }

    .brand p {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 4px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 500;
      color: #475569;
    }

    input, select {
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
      background: #fff;
    }

    input:focus, select:focus { border-color: #1e40af; }

    select { cursor: pointer; }

    .hint {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .error {
      font-size: 0.82rem;
      color: #dc2626;
      min-height: 18px;
      margin-bottom: 8px;
    }

    button[type="submit"] {
      width: 100%;
      padding: 11px;
      background: #1e40af;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 4px;
    }

    button[type="submit"]:hover:not(:disabled) { background: #1d3a9a; }
    button[type="submit"]:disabled { background: #93a3c4; cursor: not-allowed; }

    .footer-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.85rem;
      color: #64748b;
    }

    .footer-link a {
      color: #1e40af;
      font-weight: 500;
      text-decoration: none;
    }

    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h1>SGE</h1>
      <p>Criar nova conta</p>
    </div>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="fullName">Nome completo</label>
        <input
          type="text"
          id="fullName"
          name="fullName"
          placeholder="Maria da Silva"
          required
          autocomplete="name"
        >
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="seu@email.com"
          required
          autocomplete="email"
        >
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Mínimo 6 caracteres"
          required
          autocomplete="new-password"
        >
      </div>

      <div class="field">
        <label for="role">Perfil de acesso</label>
        <select id="role" name="role" required>
          <option value="" disabled selected>Selecione seu perfil</option>
          <option value="teacher">Professor</option>
          <option value="director">Diretor</option>
          <option value="guardian">Responsável</option>
        </select>
      </div>

      <div class="field">
        <label for="schoolId">Código da escola</label>
        <input
          type="text"
          id="schoolId"
          name="schoolId"
          placeholder="Ex: escola-abc-123"
          required
        >
        <span class="hint">Código fornecido pela sua escola.</span>
      </div>

      <p id="errorMsg" class="error" role="alert"></p>

      <button type="submit">Cadastrar</button>
    </form>

    <p class="footer-link">
      Já tem conta? <a href="login.html">Entrar</a>
    </p>
  </div>

  <script type="module">
    import { authController } from './auth.controller.js';

    authController.bindRegisterForm(
      document.getElementById('registerForm'),
      document.getElementById('errorMsg')
    );
  </script>
</body>
</html>
