<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGE — Chamada</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      visibility: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    nav {
      background: #1e40af;
      color: #fff;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    nav .brand { font-weight: 700; font-size: 1rem; }

    nav .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.875rem;
    }

    nav .role-badge {
      background: rgba(255,255,255,0.15);
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 0.78rem;
    }

    button.logout {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      padding: 5px 14px;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    button.logout:hover { background: rgba(255,255,255,0.22); }

    main {
      max-width: 760px;
      margin: 36px auto;
      padding: 0 20px;
    }

    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .page-header a {
      color: #64748b;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .page-header a:hover { color: #1e40af; }

    .page-header h1 { font-size: 1.3rem; font-weight: 600; }

    .placeholder-card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      padding: 48px 24px;
      text-align: center;
      color: #94a3b8;
    }

    .placeholder-card p { font-size: 0.9rem; margin-top: 8px; }
  </style>
</head>
<body>
  <nav>
    <span class="brand">SGE</span>
    <div class="nav-right">
      <span id="userName"></span>
      <span class="role-badge">Professor</span>
      <button class="logout" id="logoutBtn">Sair</button>
    </div>
  </nav>

  <main>
    <div class="page-header">
      <a href="index.html">← Dashboard</a>
      <h1>Chamada</h1>
    </div>

    <div class="placeholder-card">
      <div style="font-size:2rem">📋</div>
      <p>Módulo de chamada em desenvolvimento.</p>
    </div>
  </main>

  <script type="module">
    import { authController } from '../../auth/auth.controller.js';

    const user = await authController.guardRoute('teacher');
    if (!user) return;

    document.getElementById('userName').textContent = user.name;
    document.getElementById('logoutBtn').addEventListener('click', () => authController.logout());
    document.body.style.visibility = 'visible';
  </script>
</body>
</html>
