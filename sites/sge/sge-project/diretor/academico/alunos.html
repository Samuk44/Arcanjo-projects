<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <meta name="theme-color" content="#0f1115" />
    <meta name="robots" content="noindex" />
    <title>SGE v2.0 - Gestão de Alunos</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&family=Syne:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1115;
        --surface: #181b21;
        --surface-alt: #1f2329;
        --primary: #f0a500;
        --primary-hover: #e09500;
        --text: #e6e9ed;
        --text-secondary: #a8adb5;
        --text-tertiary: #7a8089;
        --border: #2d3139;
        --success: #22c55e;
        --danger: #f43f5e;
        --warning: #facc15;
        --info: #3b82f6;
        --radius: 0.5rem;
        --transition: 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          "DM Sans",
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }

      .container {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 100vh;
      }

      .sidebar {
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 2.5rem;
        font-weight: 700;
        color: var(--primary);
        font-size: 1.25rem;
      }

      .sidebar-logo {
        width: 32px;
        height: 32px;
        background: var(--primary);
        border-radius: var(--radius);
        display: grid;
        place-items: center;
        color: var(--bg);
        font-weight: 900;
      }

      .sidebar-nav {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .sidebar-nav a {
        padding: 0.75rem 1rem;
        border-radius: var(--radius);
        text-decoration: none;
        color: var(--text-secondary);
        transition: all var(--transition);
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.95rem;
      }

      .sidebar-nav a:hover,
      .sidebar-nav a.active {
        background: var(--surface-alt);
        color: var(--primary);
      }

      .main-content {
        padding: 2rem;
        overflow-y: auto;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 2rem;
      }

      .header h1 {
        font-family: "Syne", sans-serif;
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .header p {
        color: var(--text-secondary);
        font-size: 0.95rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        border-radius: var(--radius);
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--transition);
        border: 1px solid transparent;
        font-family: inherit;
      }

      .btn-primary {
        background: var(--primary);
        color: var(--bg);
      }

      .btn-primary:hover {
        background: var(--primary-hover);
      }

      .controls {
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      select,
      input[type="search"] {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.75rem 1rem;
        border-radius: var(--radius);
        font-family: inherit;
        font-size: 0.9rem;
        transition: all var(--transition);
      }

      select:focus,
      input[type="search"]:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(240, 165, 0, 0.1);
      }

      .table-wrapper {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow-x: auto;
        margin-bottom: 2rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      th {
        background: var(--surface-alt);
        padding: 1rem;
        text-align: left;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        border-bottom: 1px solid var(--border);
      }

      td {
        padding: 1rem;
        border-bottom: 1px solid var(--border);
      }

      tr:hover {
        background: rgba(240, 165, 0, 0.02);
      }

      .aluno-nome {
        font-weight: 600;
        color: var(--primary);
        cursor: pointer;
      }

      .freq-badge {
        display: inline-flex;
        padding: 0.2rem 0.5rem;
        border-radius: 4px;
        font-family: "DM Mono", monospace;
        font-weight: 700;
        font-size: 0.8rem;
      }

      .freq-ok {
        background: rgba(34, 197, 94, 0.1);
        color: var(--success);
      }
      .freq-atencao {
        background: rgba(250, 204, 21, 0.1);
        color: var(--warning);
      }
      .freq-risco {
        background: rgba(244, 63, 94, 0.1);
        color: var(--danger);
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(12px);
        display: none;
        place-items: center;
        z-index: 1000;
        padding: 1.5rem;
      }

      .modal-overlay.active {
        display: grid;
      }

      .modal {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
        width: 100%;
        max-width: 600px;
        animation: modalIn var(--transition);
      }

      @keyframes modalIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .modal-header {
        padding: 1.5rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .modal-body {
        padding: 2rem;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      .form-label {
        display: block;
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--text-tertiary);
        margin-bottom: 0.5rem;
        letter-spacing: 0.05em;
      }

      input[type="text"],
      select {
        width: 100%;
        background: var(--surface-alt);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.75rem 1rem;
        border-radius: var(--radius);
        font-family: inherit;
      }

      #toast-container {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .toast {
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 4px solid var(--primary);
        padding: 1rem 1.5rem;
        border-radius: var(--radius);
        color: var(--text);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        min-width: 320px;
        animation: toastIn 0.4s var(--transition);
      }

      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
        }
        .sidebar {
          display: none;
        }
        .controls {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">S</div>
          <span>SGE v2.0</span>
        </div>
        <nav class="sidebar-nav">
          <a href="#"><span>📊</span> Dashboard</a>
          <a href="../usuarios/professores.html"><span>👨‍🏫</span> Professores</a>
          <a href="#" class="active"><span>👥</span> Alunos</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="header">
          <div>
            <h1>Gestão Acadêmica de Alunos</h1>
            <p>Controle de matrículas, transferências e vínculos familiares</p>
          </div>
          <button class="btn btn-primary" id="btn-novo-aluno">
            + Matricular Aluno
          </button>
        </header>

        <div class="controls">
          <select id="select-turma" aria-label="Selecione a turma">
            <option value="">Todas as turmas</option>
          </select>
          <input
            type="search"
            id="search-aluno"
            placeholder="Buscar aluno por nome ou matrícula..."
            aria-label="Buscar aluno"
          />
        </div>

        <div class="table-wrapper">
          <table role="table" aria-label="Lista de alunos">
            <thead>
              <tr>
                <th>Matrícula</th>
                <th>Nome</th>
                <th>Turma</th>
                <th>Frequência</th>
                <th>Média</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-alunos">
              <tr>
                <td colspan="6" style="text-align: center; padding: 2rem">
                  Carregando alunos...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <!-- Modal Vínculo Responsável -->
    <div id="modal-vinculo" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h2
            style="
              font-family: &quot;Syne&quot;, sans-serif;
              font-size: 1.25rem;
              font-weight: 700;
            "
          >
            Vincular Responsável
          </h2>
          <button
            style="
              padding: 0.4rem 0.8rem;
              background: var(--surface-alt);
              border: 1px solid var(--border);
              color: var(--text);
              border-radius: 4px;
              cursor: pointer;
            "
            onclick="closeModal('modal-vinculo')"
          >
            ✕
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Aluno</label>
            <input
              type="text"
              id="vinculo-aluno-nome"
              disabled
              style="opacity: 0.7"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Buscar Responsável (CPF ou E-mail)</label>
            <input
              type="text"
              id="search-pai"
              placeholder="Ex: 123.456.789-00"
            />
          </div>
          <div
            id="pai-resultado"
            style="
              margin-top: 1rem;
              padding: 1rem;
              background: var(--surface-alt);
              border-radius: var(--radius);
              display: none;
            "
          >
            <div style="font-weight: 700" id="pai-nome-res">João Silva</div>
            <div
              style="font-size: 0.85rem; color: var(--text-tertiary)"
              id="pai-email-res"
            >
              joao@email.com
            </div>
            <button
              class="btn btn-primary"
              style="margin-top: 1rem; width: 100%"
              id="btn-confirmar-vinculo"
            >
              Confirmar Vínculo
            </button>
          </div>
        </div>
      </div>
    </div>

    <div id="toast-container"></div>

    <script type="module" src="../js/academico-alunos.js"></script>
  </body>
</html>
