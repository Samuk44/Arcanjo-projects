<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <meta name="theme-color" content="#0f1115" />
    <title>SGE v2.0 - Comunicados</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&family=Syne:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1115;
        --surface: #181b21;
        --surface-alt: #1f2329;
        --primary: #f0a500;
        --primary-hover: #e09500;
        --text: #e6e9ed;
        --text-secondary: #a8adb5;
        --text-tertiary: #7a8089;
        --border: #2d3139;
        --success: #22c55e;
        --danger: #f43f5e;
        --warning: #facc15;
        --info: #3b82f6;
        --radius: 0.5rem;
        --transition: 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          "DM Sans",
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }

      .app-container {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 100vh;
      }

      .sidebar {
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 2.5rem;
        font-weight: 700;
        color: var(--primary);
        font-size: 1.25rem;
      }

      .sidebar-logo {
        width: 32px;
        height: 32px;
        background: var(--primary);
        border-radius: var(--radius);
        display: grid;
        place-items: center;
        color: var(--bg);
        font-weight: 900;
      }

      .sidebar-nav {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .sidebar-nav a {
        padding: 0.75rem 1rem;
        border-radius: var(--radius);
        text-decoration: none;
        color: var(--text-secondary);
        transition: all var(--transition);
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.95rem;
      }

      .sidebar-nav a:hover,
      .sidebar-nav a.active {
        background: var(--surface-alt);
        color: var(--primary);
      }

      .main-content {
        padding: 2rem;
        overflow-y: auto;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 2rem;
      }

      .header h1 {
        font-family: "Syne", sans-serif;
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .header p {
        color: var(--text-secondary);
        font-size: 0.95rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        border-radius: var(--radius);
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--transition);
        border: 1px solid transparent;
        font-family: inherit;
      }

      .btn-primary {
        background: var(--primary);
        color: var(--bg);
      }

      .btn-primary:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
      }

      .filters {
        display: flex;
        gap: 1rem;
        margin-bottom: 2rem;
        flex-wrap: wrap;
      }

      .filter-group {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }

      .filter-label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-tertiary);
        text-transform: uppercase;
      }

      select,
      input[type="search"] {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.6rem 1rem;
        border-radius: var(--radius);
        font-family: inherit;
        font-size: 0.9rem;
        transition: all var(--transition);
      }

      select:focus,
      input[type="search"]:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(240, 165, 0, 0.1);
      }

      .comunicados-list {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .comunicado-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.5rem;
        transition: all var(--transition);
        animation: fadeIn 0.4s var(--transition);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .comunicado-card:hover {
        border-color: var(--primary);
        background: rgba(240, 165, 0, 0.02);
      }

      .comunicado-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 1rem;
      }

      .comunicado-title {
        font-family: "Syne", sans-serif;
        font-size: 1.125rem;
        font-weight: 700;
        color: var(--text);
        flex: 1;
      }

      .badge {
        display: inline-flex;
        padding: 0.25rem 0.75rem;
        border-radius: 2rem;
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .badge-urgencia-alto {
        background: rgba(244, 63, 94, 0.1);
        color: var(--danger);
      }
      .badge-urgencia-médio {
        background: rgba(250, 204, 21, 0.1);
        color: var(--warning);
      }
      .badge-urgencia-baixo {
        background: rgba(34, 197, 94, 0.1);
        color: var(--success);
      }
      .badge-status-pendente {
        background: rgba(250, 204, 21, 0.1);
        color: var(--warning);
      }
      .badge-status-enviado {
        background: rgba(34, 197, 94, 0.1);
        color: var(--success);
      }

      .comunicado-meta {
        font-size: 0.8rem;
        color: var(--text-tertiary);
        font-family: "DM Mono", monospace;
        margin-bottom: 0.75rem;
      }

      .comunicado-preview {
        color: var(--text-secondary);
        font-size: 0.95rem;
        line-height: 1.5;
        margin-bottom: 1rem;
        max-height: 60px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .comunicado-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
      }

      .comunicado-stats {
        display: flex;
        gap: 1.5rem;
        font-size: 0.85rem;
        color: var(--text-secondary);
      }

      .stat-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .stat-value {
        font-family: "DM Mono", monospace;
        font-weight: 700;
        color: var(--primary);
      }

      .comunicado-actions {
        display: flex;
        gap: 0.75rem;
      }

      .btn-small {
        padding: 0.5rem 1rem;
        font-size: 0.8rem;
        background: var(--surface-alt);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: var(--radius);
        cursor: pointer;
        transition: all var(--transition);
      }

      .btn-small:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(12px);
        display: none;
        place-items: center;
        z-index: 1000;
        padding: 1.5rem;
      }

      .modal-overlay.active {
        display: grid;
      }

      .modal {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
        width: 100%;
        max-width: 600px;
        max-height: 90vh;
        overflow-y: auto;
        animation: modalIn var(--transition);
      }

      @keyframes modalIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .modal-header {
        padding: 1.5rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .modal-body {
        padding: 2rem;
      }

      .modal-footer {
        padding: 1.5rem;
        background: var(--surface-alt);
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: flex-end;
        gap: 1rem;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      .form-label {
        display: block;
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--text-tertiary);
        margin-bottom: 0.5rem;
        letter-spacing: 0.05em;
      }

      input[type="text"],
      textarea,
      select {
        width: 100%;
        background: var(--surface-alt);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.75rem 1rem;
        border-radius: var(--radius);
        font-family: inherit;
        font-size: 0.95rem;
      }

      textarea {
        resize: vertical;
        min-height: 120px;
      }

      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(240, 165, 0, 0.1);
      }

      .char-count {
        font-size: 0.75rem;
        color: var(--text-tertiary);
        margin-top: 0.25rem;
        font-family: "DM Mono", monospace;
      }

      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }

      .metric-box {
        background: var(--surface-alt);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.5rem;
        text-align: center;
      }

      .metric-value {
        font-family: "DM Mono", monospace;
        font-size: 2rem;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 0.5rem;
      }

      .metric-label {
        font-size: 0.85rem;
        color: var(--text-tertiary);
        text-transform: uppercase;
        font-weight: 600;
      }

      #toast-container {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .toast {
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 4px solid var(--primary);
        padding: 1rem 1.5rem;
        border-radius: var(--radius);
        color: var(--text);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        min-width: 320px;
        display: flex;
        align-items: center;
        gap: 1rem;
        animation: toastIn 0.4s var(--transition);
      }

      @keyframes toastIn {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      .toast.success {
        border-left-color: var(--success);
      }
      .toast.error {
        border-left-color: var(--danger);
      }
      .toast.warning {
        border-left-color: var(--warning);
      }

      .load-more {
        text-align: center;
        padding: 2rem;
      }

      .btn-load-more {
        padding: 0.75rem 2rem;
        background: var(--surface-alt);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: var(--radius);
        cursor: pointer;
        transition: all var(--transition);
        font-weight: 600;
      }

      .btn-load-more:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

      @media (max-width: 768px) {
        .app-container {
          grid-template-columns: 1fr;
        }
        .sidebar {
          display: none;
        }
        .header {
          flex-direction: column;
          gap: 1rem;
        }
        .filters {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">S</div>
          <span>SGE v2.0</span>
        </div>
        <nav class="sidebar-nav">
          <a href="#"><span>📊</span> Dashboard</a>
          <a href="#" class="active"><span>📢</span> Comunicados</a>
          <a href="#"><span>👤</span> Aprovações</a>
          <a href="#"><span>⚙️</span> Configurações</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="header">
          <div>
            <h1>Comunicados</h1>
            <p>Gerencie avisos e notificações para a comunidade escolar</p>
          </div>
          <button class="btn btn-primary" id="btn-novo-comunicado">
            + Novo Comunicado
          </button>
        </header>

        <div class="filters">
          <div class="filter-group">
            <label class="filter-label">Urgência</label>
            <select id="filter-urgencia">
              <option value="">Todos</option>
              <option value="alto">Alto</option>
              <option value="médio">Médio</option>
              <option value="baixo">Baixo</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">Turma</label>
            <select id="filter-turma">
              <option value="">Todas</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">Status</label>
            <select id="filter-status">
              <option value="">Todos</option>
              <option value="pendente">Pendente</option>
              <option value="enviado">Enviado</option>
            </select>
          </div>
        </div>

        <section
          class="comunicados-list"
          id="lista-comunicados"
          aria-live="polite"
          aria-label="Lista de comunicados"
        >
          <div
            style="
              text-align: center;
              padding: 3rem;
              color: var(--text-tertiary);
            "
          >
            Carregando comunicados...
          </div>
        </section>

        <div class="load-more" id="load-more-container" style="display: none">
          <button class="btn-load-more" id="btn-load-more">
            Carregar Mais
          </button>
        </div>
      </main>
    </div>

    <!-- Modal Novo Comunicado -->
    <div id="modal-novo" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h2
            style="
              font-family: &quot;Syne&quot;, sans-serif;
              font-size: 1.25rem;
              font-weight: 700;
            "
          >
            Novo Comunicado
          </h2>
          <button class="btn-small" onclick="closeModal('modal-novo')">
            ✕
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Título</label>
            <input
              type="text"
              id="input-titulo"
              placeholder="Ex: Aula de Reforço Amanhã"
              maxlength="100"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Mensagem</label>
            <textarea
              id="input-mensagem"
              placeholder="Escreva o conteúdo do comunicado..."
              maxlength="2000"
            ></textarea>
            <div class="char-count"><span id="char-count">0</span>/2000</div>
          </div>
          <div class="form-group">
            <label class="form-label">Destinatário</label>
            <select id="input-destinatario">
              <option value="">Selecione...</option>
              <option value="escola">Toda a Escola</option>
              <option value="turma">Turma Específica</option>
              <option value="aluno">Aluno Específico</option>
            </select>
          </div>
          <div class="form-group" id="turma-select-group" style="display: none">
            <label class="form-label">Selecione a Turma</label>
            <select id="input-turma-especifica"></select>
          </div>
          <div class="form-group">
            <label class="form-label">Nível de Urgência</label>
            <select id="input-urgencia">
              <option value="baixo">Baixo</option>
              <option value="médio" selected>Médio</option>
              <option value="alto">Alto</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-small" onclick="closeModal('modal-novo')">
            Cancelar
          </button>
          <button class="btn btn-primary" id="btn-enviar-comunicado">
            Enviar Comunicado
          </button>
        </div>
      </div>
    </div>

    <!-- Modal Métricas -->
    <div id="modal-metricas" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h2
            style="
              font-family: &quot;Syne&quot;, sans-serif;
              font-size: 1.25rem;
              font-weight: 700;
            "
          >
            Métricas de Leitura
          </h2>
          <button class="btn-small" onclick="closeModal('modal-metricas')">
            ✕
          </button>
        </div>
        <div class="modal-body">
          <div class="metrics-grid" id="metricas-container"></div>
          <h3
            style="
              margin-bottom: 1rem;
              font-family: &quot;Syne&quot;, sans-serif;
            "
          >
            Leitura por Turma
          </h3>
          <div id="metricas-turmas"></div>
        </div>
        <div class="modal-footer">
          <button class="btn-small" onclick="closeModal('modal-metricas')">
            Fechar
          </button>
        </div>
      </div>
    </div>

    <div id="toast-container"></div>

    <script type="module" src="./js/comunicados.js"></script>
  </body>
</html>
