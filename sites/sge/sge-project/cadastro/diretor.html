<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="robots" content="noindex" />
    <title>Cadastro de Diretor - SGE v2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;700&family=Syne:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1115;
        --surface: #181b21;
        --border: #2a2e35;
        --primary: #f0a500;
        --text: #e6e9ed;
      }

      body {
        margin: 0;
        font-family: "DM Sans", sans-serif;
        color: var(--text);
        background-color: var(--bg);
        min-height: 100vh;
        display: grid;
        place-items: center;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      .container {
        max-width: 700px;
        width: 100%;
        padding: 2rem;
        box-sizing: border-box;
      }

      @media (max-width: 768px) {
        .container {
          padding: 1rem;
        }
      }

      header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .logo {
        font-family: "Syne", sans-serif;
        font-size: 2.5rem;
        color: var(--primary);
        margin-bottom: 0.5rem;
      }

      h1 {
        font-family: "Syne", sans-serif;
        font-size: 2rem;
        margin-bottom: 0.5rem;
        color: var(--text);
      }

      h2 {
        font-size: 1rem;
        color: var(--text);
        opacity: 0.8;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      fieldset {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.5rem;
        margin: 0;
        min-width: 0;
      }

      legend {
        font-family: "Syne", sans-serif;
        font-size: 1.2rem;
        color: var(--text);
        padding: 0 0.5rem;
        margin-left: -0.5rem;
      }

      .form-group {
        margin-bottom: 1rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
        color: var(--text);
        font-family: "DM Mono", monospace; /* Labels técnicos */
      }

      input[type="text"],
      input[type="email"],
      input[type="tel"],
      input[type="password"] {
        width: 100%;
        padding: 1rem;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 1rem;
        box-sizing: border-box;
      }

      input[type="text"]:focus,
      input[type="email"]:focus,
      input[type="tel"]:focus,
      input[type="password"]:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(240, 165, 0, 0.2);
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        margin-top: 1rem;
      }

      .checkbox-group input[type="checkbox"] {
        margin-right: 0.5rem;
      }

      .checkbox-group label {
        margin-bottom: 0;
        font-family: "DM Sans", sans-serif;
      }

      .checkbox-group a {
        color: var(--primary);
        text-decoration: none;
      }

      .checkbox-group a:hover {
        text-decoration: underline;
      }

      button[type="submit"] {
        background: var(--primary);
        color: #0f1115;
        font-weight: 600;
        padding: 1rem 1.5rem;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        transition:
          background-color 0.3s,
          opacity 0.3s;
      }

      button[type="submit"]:hover:not(:disabled) {
        background-color: #d49200;
      }

      button[type="submit"]:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      @media (max-width: 768px) {
        button[type="submit"] {
          width: 100%;
        }
      }

      .radio-cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-top: 1rem;
      }

      @media (max-width: 768px) {
        .radio-cards {
          grid-template-columns: 1fr;
        }
      }

      .radio-card {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem;
        cursor: pointer;
        transition:
          border-color 0.3s,
          background-color 0.3s;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .radio-card input[type="radio"] {
        display: none;
      }

      .radio-card input[type="radio"]:checked + .card-content {
        border-color: var(--primary);
        background: rgba(240, 165, 0, 0.05);
      }

      .radio-card .card-content {
        border: 1px solid transparent; /* Para manter o espaçamento */
        border-radius: 6px;
        padding: 0.5rem;
      }

      .radio-card h3 {
        margin: 0;
        font-size: 1.1rem;
        color: var(--text);
        font-family: "Syne", sans-serif;
      }

      .radio-card p {
        margin: 0;
        font-size: 0.85rem;
        color: var(--text);
        opacity: 0.7;
      }

      #form-feedback {
        display: none;
        margin-top: 1.5rem;
        padding: 1rem;
        border-radius: 8px;
        font-size: 0.9rem;
      }

      #form-feedback.success {
        background-color: rgba(0, 255, 0, 0.1);
        color: #0f0;
      }

      #form-feedback.error {
        background-color: rgba(255, 0, 0, 0.1);
        color: #f00;
      }

      /* Password Strength Meter (Visual only, JS will handle logic) */
      .password-strength {
        height: 5px;
        background: var(--border);
        border-radius: 2.5px;
        margin-top: 0.5rem;
        overflow: hidden;
      }

      .password-strength-bar {
        height: 100%;
        width: 0%;
        background: gray;
        transition:
          width 0.3s ease-in-out,
          background-color 0.3s ease-in-out;
      }

      .password-strength-bar.weak {
        background: red;
        width: 33%;
      }

      .password-strength-bar.medium {
        background: orange;
        width: 66%;
      }

      .password-strength-bar.strong {
        background: green;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div
        style="
          background-color: #ffcc00;
          color: #333;
          padding: 1rem;
          text-align: center;
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          z-index: 9999;
        "
      >
        Este site requer JavaScript para funcionar corretamente. Por favor,
        habilite o JavaScript em seu navegador.
      </div>
    </noscript>
    <div class="container">
      <header>
        <div class="logo">SGE</div>
        <h1>Cadastro de Diretor</h1>
        <h2>Configure sua escola e crie sua conta administrativa</h2>
      </header>

      <form id="diretor-form" novalidate role="form">
        <fieldset>
          <legend>Dados da Escola</legend>
          <div class="form-group">
            <label for="nomeEscola"
              >Nome da Escola <span style="color: red">*</span></label
            >
            <input
              type="text"
              id="nomeEscola"
              name="nomeEscola"
              required
              autocomplete="organization"
            />
          </div>
          <div class="form-group">
            <label for="cnpjEscola">CNPJ da Escola</label>
            <input
              type="text"
              id="cnpjEscola"
              name="cnpjEscola"
              placeholder="00.000.000/0000-00"
              autocomplete="off"
            />
          </div>
          <div class="form-group">
            <label for="telefoneEscola">Telefone da Escola</label>
            <input
              type="tel"
              id="telefoneEscola"
              name="telefoneEscola"
              placeholder="(00) 00000-0000"
              autocomplete="tel"
            />
          </div>
        </fieldset>

        <fieldset>
          <legend>Dados do Diretor</legend>
          <div class="form-group">
            <label for="nomeCompleto"
              >Nome Completo <span style="color: red">*</span></label
            >
            <input
              type="text"
              id="nomeCompleto"
              name="nomeCompleto"
              required
              autocomplete="name"
            />
          </div>
          <div class="form-group">
            <label for="cpf">CPF</label>
            <input
              type="text"
              id="cpf"
              name="cpf"
              placeholder="000.000.000-00"
              autocomplete="off"
            />
          </div>
          <div class="form-group">
            <label for="email">E-mail <span style="color: red">*</span></label>
            <input
              type="email"
              id="email"
              name="email"
              required
              autocomplete="email"
            />
          </div>
          <div class="form-group">
            <label for="telefone">Telefone</label>
            <input
              type="tel"
              id="telefone"
              name="telefone"
              placeholder="(00) 00000-0000"
              autocomplete="tel"
            />
          </div>
        </fieldset>

        <fieldset>
          <legend>Acesso & Plano</legend>
          <div class="form-group">
            <label for="senha">Senha <span style="color: red">*</span></label>
            <input
              type="password"
              id="senha"
              name="senha"
              required
              autocomplete="new-password"
            />
            <div class="password-strength">
              <div
                class="password-strength-bar"
                id="password-strength-bar"
              ></div>
            </div>
          </div>
          <div class="form-group">
            <label for="confirmarSenha"
              >Confirmar Senha <span style="color: red">*</span></label
            >
            <input
              type="password"
              id="confirmarSenha"
              name="confirmarSenha"
              required
              autocomplete="new-password"
            />
          </div>
          <div class="form-group">
            <label>Selecione seu Plano <span style="color: red">*</span></label>
            <div class="radio-cards">
              <label class="radio-card">
                <input
                  type="radio"
                  name="plano"
                  value="simples"
                  data-plan="simples"
                  required
                />
                <div class="card-content">
                  <h3>Plano Simples</h3>
                  <p>Recursos essenciais para começar.</p>
                </div>
              </label>
              <label class="radio-card">
                <input
                  type="radio"
                  name="plano"
                  value="completo"
                  data-plan="completo"
                />
                <div class="card-content">
                  <h3>Plano Completo</h3>
                  <p>Todos os recursos avançados.</p>
                </div>
              </label>
            </div>
          </div>
        </fieldset>

        <div class="checkbox-group">
          <input
            type="checkbox"
            id="aceiteTermos"
            name="aceiteTermos"
            required
          />
          <label for="aceiteTermos">
            Eu li e concordo com os
            <a href="/termos-de-uso" target="_blank">Termos de Uso</a> e a
            <a href="/politica-de-privacidade" target="_blank"
              >Política de Privacidade</a
            >.
          </label>
        </div>

        <button type="button" id="btn-submit" onclick="window.location.href='./diretor/index.html'">
          Criar Conta
        </button>
        <div id="form-feedback" aria-live="polite"></div>
      </form>
    </div>

    <script type="module" src="./diretor.js"></script>
  </body>
  <!-- SGE v2.0 • Director Registration UI • 2026-05-15 -->
</html>
