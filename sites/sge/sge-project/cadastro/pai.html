<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f1115">
    <meta name="robots" content="noindex, nofollow">
    <title>Cadastro de Responsável - SGE v2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1115;
            --surface: #181b21;
            --border: #2a2e35;
            --text: #e6e9ed;
            --text-muted: #a8adb5;
            --primary: #f0a500;
            --success: #10b981;
            --error: #ff6b6b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; }

        .container { max-width: 700px; width: 100%; }
        header { text-align: center; margin-bottom: 3rem; }
        h1 { font-family: 'Syne', sans-serif; font-size: 2rem; color: var(--primary); margin-bottom: 0.5rem; }
        p.subtitle { color: var(--text-muted); }

        /* Progress Bar */
        .progress-bar { display: flex; justify-content: space-between; margin-bottom: 3rem; position: relative; }
        .progress-bar::before { content: ''; position: absolute; top: 20px; left: 0; right: 0; height: 2px; background: var(--border); z-index: 1; }
        .step { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
        .step-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--border); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; transition: all 0.3s; }
        .step-label { font-size: 0.65rem; text-transform: uppercase; font-weight: 600; color: var(--text-muted); text-align: center; }
        
        .step.active .step-icon { background: var(--primary); color: #0f1115; }
        .step.active .step-label { color: var(--primary); }
        .step.completed .step-icon { background: var(--success); color: #fff; }
        .step.completed .step-label { color: var(--success); }

        /* Wizard Steps */
        .wizard-step { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 2.5rem; animation: slideIn 0.3s ease-out; }
        .wizard-step.active { display: block; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        .input-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.85rem; margin-bottom: 0.5rem; color: var(--text-muted); font-weight: 600; }
        .input-field { width: 100%; padding: 1rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; }
        .input-field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(240,165,0,0.2); }

        .btn { padding: 1rem 2rem; border-radius: 8px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: #0f1115; }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .nav-btns { display: flex; justify-content: space-between; margin-top: 2rem; }

        /* Verification Result */
        #aluno-confirm { margin-top: 1rem; padding: 1rem; background: rgba(16,185,129,0.1); border: 1px solid var(--success); border-radius: 8px; display: none; }
        
        #toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--primary); color: var(--text); padding: 1rem 2rem; border-radius: 8px; display: none; z-index: 2000; }

        @media (max-width: 768px) { .step-label { display: none; } .wizard-step { padding: 1.5rem; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Cadastro de Responsável</h1>
            <p class="subtitle">Vincule-se ao seu filho em 4 passos</p>
        </header>

        <div class="progress-bar">
            <div class="step active" data-step="1">
                <div class="step-icon">1</div>
                <span class="step-label">Dados Pessoais</span>
            </div>
            <div class="step" data-step="2">
                <div class="step-icon">2</div>
                <span class="step-label">Vínculo Aluno</span>
            </div>
            <div class="step" data-step="3">
                <div class="step-icon">3</div>
                <span class="step-label">Acesso</span>
            </div>
            <div class="step" data-step="4">
                <div class="step-icon">4</div>
                <span class="step-label">Revisão</span>
            </div>
        </div>

        <form id="wizard-form">
            <!-- Step 1: Dados Pessoais -->
            <section class="wizard-step active" id="step-1">
                <div class="input-group">
                    <label>Nome Completo</label>
                    <input type="text" id="nome" class="input-field" required>
                </div>
                <div class="input-group">
                    <label>CPF</label>
                    <input type="text" id="cpf" class="input-field" placeholder="000.000.000-00" required>
                </div>
                <div class="input-group">
                    <label>Telefone</label>
                    <input type="text" id="telefone" class="input-field" placeholder="(00) 00000-0000" required>
                </div>
                <div class="input-group">
                    <label>E-mail</label>
                    <input type="email" id="email" class="input-field" required>
                </div>
            </section>

            <!-- Step 2: Vínculo Aluno -->
            <section class="wizard-step" id="step-2">
                <div class="input-group">
                    <label>RA do Aluno</label>
                    <div style="display: flex; gap: 0.5rem;">
                        <input type="text" id="raAluno" class="input-field" placeholder="Ex: 123456789" required>
                        <button type="button" class="btn btn-secondary" id="btn-verificar">Verificar</button>
                    </div>
                </div>
                <div id="aluno-confirm">
                    <p style="font-size: 0.8rem; color: var(--success); font-weight: 600;">Aluno Localizado:</p>
                    <p id="aluno-nome" style="font-weight: 700; margin-top: 0.25rem;"></p>
                    <p id="aluno-turma" style="font-size: 0.85rem; color: var(--text-muted);"></p>
                </div>
            </section>

            <!-- Step 3: Acesso -->
            <section class="wizard-step" id="step-3">
                <div class="input-group">
                    <label>Senha</label>
                    <input type="password" id="senha" class="input-field" required>
                </div>
                <div class="input-group">
                    <label>Confirmar Senha</label>
                    <input type="password" id="confirmarSenha" class="input-field" required>
                </div>
                <div class="input-group">
                    <label>Notificações</label>
                    <div style="display: grid; gap: 0.75rem; margin-top: 0.5rem;">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" id="notif-faltas" checked> Faltas e Presenças
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" id="notif-notas" checked> Notas e Desempenho
                        </label>
                    </div>
                </div>
            </section>

            <!-- Step 4: Revisão -->
            <section class="wizard-step" id="step-4">
                <div id="revisao-content"></div>
                <div style="margin-top: 2rem;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" id="termos" required>
                        Aceito os termos de uso e política de privacidade
                    </label>
                </div>
            </section>

            <div class="nav-btns">
                <button type="button" class="btn btn-secondary" id="btn-prev" disabled>← Voltar</button>
                <button type="button" class="btn btn-primary" id="btn-next">Continuar →</button>
            </div>
        </form>
    </div>

    <div id="toast"></div>
    <script type="module" src="js/pai.js"></script>
</body>
</html>
