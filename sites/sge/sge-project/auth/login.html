<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGE - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../assets/css/global.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/forms.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: var(--spacing-xl);
    }
    .login-header {
      text-align: center;
      margin-bottom: var(--spacing-xl);
    }
    .login-logo {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--color-amber);
      margin-bottom: var(--spacing-md);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="card login-card">
      <div class="login-header">
        <div class="login-logo">SGE</div>
        <h2>Sistema de Gestão Escolar</h2>
        <p class="text-muted mt-md">Faça login para continuar</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email" class="required">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">
          <label for="password" class="required">Senha</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary w-full mb-md">Entrar</button>

        <div class="divider-text">ou</div>

        <a href="../cadastro/escolha-cadastro.html" class="btn btn-secondary w-full">Criar Conta</a>
      </form>

      <div class="mt-lg text-center">
        <a href="../auth/recuperar-senha.html" class="text-sm">Esqueceu sua senha?</a>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="../assets/js/mock/data.js"></script>
  <script src="../assets/js/mock/auth.mock.js"></script>
  <script src="../assets/js/core/session.js"></script>
  <script src="../assets/js/core/router.js"></script>
  <script src="../assets/js/core/notifications.js"></script>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const user = await mockAuth.login(email, password);
        if (user) {
          session.setUser(user);
          notifications.success('Login realizado com sucesso!');
          setTimeout(() => router.redirectByRole(user.role), 1000);
        } else {
          notifications.error('E-mail ou senha inválidos');
        }
      } catch (error) {
        notifications.error('Erro ao fazer login');
      }
    });
  </script>
</body>
</html>
