<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SGE v2.0 — Cadastro de Responsável</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              bg: "#0f1115",
              surface: "#181b21",
              border: "#2a2e35",
              primary: "#f0a500",
              primaryHover: "#d49200",
              text: "#e6e9ed",
              muted: "#8b949e",
              danger: "#f43f5e",
              success: "#22c55e",
            },
            fontFamily: {
              sans: ["DM Sans", "sans-serif"],
              display: ["Syne", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body { background-color: #0f1115; color: #e6e9ed; font-family: "DM Sans", sans-serif; }
      .field-error { display: none; color: #f43f5e; font-size: 0.78rem; margin-top: 0.25rem; }
      .field-error.visible { display: block; }
      .toast-wrap {
        position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999;
        display: flex; flex-direction: column; gap: 0.5rem;
      }
      .toast {
        padding: 0.75rem 1.25rem; border-radius: 0.5rem;
        font-size: 0.875rem; font-weight: 500; min-width: 240px;
        animation: slideIn 0.25s ease;
      }
      .toast.success { background: #16632e; border: 1px solid #22c55e; color: #d1fae5; }
      .toast.error   { background: #6b1226; border: 1px solid #f43f5e; color: #ffe4e6; }
      @keyframes slideIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center px-4 py-8">

    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <a href="../index.html">
          <img src="../assets/img/logo.png" alt="SGE" class="h-12 w-auto object-contain mx-auto mb-4" onerror="this.style.display='none'" />
        </a>
        <h1 class="font-display text-2xl font-bold text-primary">Criar Conta — Responsável</h1>
        <p class="text-muted text-sm mt-1">Preencha os dados abaixo. A matrícula do aluno é obrigatória.</p>
      </div>

      <div class="bg-surface border border-border rounded-xl p-8 space-y-5 shadow-2xl">

        <div>
          <label class="block text-sm font-semibold text-muted uppercase tracking-wider mb-1.5">E-mail</label>
          <input
            type="email"
            id="email"
            autocomplete="email"
            placeholder="seu@email.com"
            class="w-full px-4 py-2.5 bg-bg border border-border rounded-lg text-text placeholder-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition text-sm"
          />
          <span class="field-error" id="err-email"></span>
        </div>

        <div>
          <label class="block text-sm font-semibold text-muted uppercase tracking-wider mb-1.5">Senha</label>
          <input
            type="password"
            id="senha"
            autocomplete="new-password"
            placeholder="Mínimo 8 caracteres"
            class="w-full px-4 py-2.5 bg-bg border border-border rounded-lg text-text placeholder-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition text-sm"
          />
          <span class="field-error" id="err-senha"></span>
        </div>

        <div>
          <label class="block text-sm font-semibold text-muted uppercase tracking-wider mb-1.5">CPF</label>
          <input
            type="text"
            id="cpf"
            autocomplete="off"
            placeholder="000.000.000-00"
            maxlength="14"
            inputmode="numeric"
            class="w-full px-4 py-2.5 bg-bg border border-border rounded-lg text-text placeholder-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition text-sm"
          />
          <span class="field-error" id="err-cpf"></span>
        </div>

        <div>
          <label class="block text-sm font-semibold text-muted uppercase tracking-wider mb-1.5">Matrícula do Aluno</label>
          <input
            type="text"
            id="matricula"
            autocomplete="off"
            placeholder="Ex: 2024001"
            class="w-full px-4 py-2.5 bg-bg border border-border rounded-lg text-text placeholder-muted focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition text-sm"
          />
          <span class="field-error" id="err-matricula"></span>
        </div>

        <button
          id="btn-cadastrar"
          type="button"
          class="w-full py-3 bg-primary hover:bg-primaryHover text-bg font-bold rounded-lg transition text-sm tracking-wide mt-2 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span id="btn-text">Criar Conta</span>
          <svg id="btn-spinner" class="hidden animate-spin h-4 w-4 text-bg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
          </svg>
        </button>

        <p class="text-center text-muted text-xs pt-2">
          Já tem conta?
          <a href="./login.html" class="text-primary hover:underline font-medium">Fazer login</a>
        </p>
      </div>
    </div>

    <div id="toast-container" class="toast-wrap"></div>

    <script type="module" src="./js/cadastro-responsavel.js"></script>

    <script>
      const cpfInput = document.getElementById("cpf");
      cpfInput.addEventListener("input", function () {
        let v = this.value.replace(/\D/g, "").slice(0, 11);
        v = v.replace(/(\d{3})(\d)/, "$1.$2")
             .replace(/(\d{3})(\d)/, "$1.$2")
             .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        this.value = v;
      });
    </script>
  </body>
</html>
