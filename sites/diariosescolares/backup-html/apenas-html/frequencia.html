<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Relatório de Frequência Escolar - Direção"
    />
    <title>Frequência - SGE Diretor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1115;
        --surface: #181b21;
        --surface-light: #1f2329;
        --primary: #f0a500;
        --primary-dark: #d48800;
        --text: #e6e9ed;
        --text-secondary: #a8adb5;
        --text-tertiary: #7a7f87;
        --error: #ff6b6b;
        --success: #51cf66;
        --warning: #ffd93d;
        --info: #4dabf7;
        --border: #2a2e35;
        --shadow: rgba(0, 0, 0, 0.3);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background-color: var(--bg);
        color: var(--text);
        line-height: 1.6;
        overflow-x: hidden;
      }

      .container {
        display: grid;
        grid-template-columns: 260px 1fr;
        min-height: 100vh;
      }

      /* Sidebar */
      .sidebar {
        width: 260px;
        background-color: var(--surface);
        border-right: 1px solid var(--border);
        padding: 1.5rem 1rem;
        position: fixed;
        height: 100vh;
      }
      .sidebar-logo {
        font-family: "Syne", sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 2rem;
      }
      .sidebar-nav-link {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.75rem 1rem;
        color: var(--text-secondary);
        text-decoration: none;
        border-radius: 0.5rem;
        transition: all 0.2s;
        font-size: 0.95rem;
        margin-bottom: 0.5rem;
      }
      .sidebar-nav-link:hover,
      .sidebar-nav-link.active {
        background-color: var(--surface-light);
        color: var(--primary);
      }

      /* Main Content */
      .main-content {
        margin-left: 260px;
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .content {
        flex: 1;
        padding: 1.5rem;
      }
      .content-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 2rem;
        flex-wrap: wrap;
        gap: 1rem;
      }
      .content-title {
        font-family: "Syne", sans-serif;
        font-size: 2rem;
        font-weight: 700;
        color: var(--text);
      }

      .action-buttons {
        display: flex;
        gap: 0.5rem;
      }
      .btn {
        padding: 0.5rem 1rem;
        background-color: var(--primary);
        color: var(--bg);
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
        font-size: 0.9rem;
      }
      .btn:hover {
        background-color: var(--primary-dark);
        transform: translateY(-2px);
      }
      .btn-secondary {
        background-color: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
      }

      /* Filters */
      .filters-container {
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 1.5rem;
        margin-bottom: 2rem;
      }
      .filters-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
      }
      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .filter-label {
        color: var(--text-secondary);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
      }
      .filter-select {
        padding: 0.5rem 1rem;
        background-color: var(--surface-light);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        font-family: "DM Sans", sans-serif;
      }

      /* Table */
      .history-table {
        width: 100%;
        border-collapse: collapse;
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        overflow: hidden;
      }
      .history-table thead {
        background-color: var(--surface-light);
        border-bottom: 1px solid var(--border);
      }
      .history-table th {
        padding: 1rem;
        text-align: left;
        color: var(--text-secondary);
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .history-table td {
        padding: 1rem;
        border-bottom: 1px solid var(--border);
        color: var(--text);
        font-size: 0.95rem;
      }
      .mono {
        font-family: "DM Mono", monospace;
      }

      .status-badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 0.25rem;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .status-badge.risk {
        background-color: rgba(255, 107, 107, 0.1);
        color: var(--error);
      }
      .status-badge.safe {
        background-color: rgba(81, 207, 102, 0.1);
        color: var(--success);
      }

      @media print {
        .sidebar,
        .filters-container,
        .action-buttons {
          display: none;
        }
        .main-content {
          margin-left: 0;
        }
        body {
          background: white;
          color: black;
        }
        .history-table {
          border: none;
        }
        .history-table th {
          color: #333;
          border-bottom: 2px solid #000;
        }
        .status-badge.risk {
          color: #ff0000;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <div class="sidebar-logo">SGE v2.0</div>
        <nav class="sidebar-nav">
          <a href="frequencia.html" class="sidebar-nav-link active"
            >Frequência</a
          >
          <a href="notas.html" class="sidebar-nav-link">Notas</a>
          <a href="comunicacao.html" class="sidebar-nav-link">Comunicação</a>
        </nav>
      </aside>

      <main class="main-content">
        <div class="content">
          <header class="content-header">
            <h1 class="content-title">Frequência Escolar</h1>
            <div class="action-buttons">
              <button class="btn btn-secondary" id="export-csv">CSV</button>
              <button class="btn" id="export-pdf">PDF</button>
            </div>
          </header>

          <section class="filters-container">
            <div class="filters-grid">
              <div class="filter-group">
                <label class="filter-label">Turma</label>
                <select id="turma" class="filter-select">
                  <option value="all">Todas as Turmas</option>
                </select>
              </div>
              <div class="filter-group">
                <label class="filter-label">Disciplina</label>
                <select id="disciplina" class="filter-select">
                  <option value="all">Todas as Disciplinas</option>
                </select>
              </div>
            </div>
          </section>

          <div style="overflow-x: auto">
            <table class="history-table">
              <thead>
                <tr>
                  <th>Aluno</th>
                  <th>Turma</th>
                  <th>Aulas</th>
                  <th>Presenças</th>
                  <th>% Freq</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="lista-frequencia"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="../../diretor/js/relatorios-frequencia.js"></script>
  </body>
</html>
