<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="robots" content="noindex" />
    <title>Cadastro de Diretor - Etapa 2 - SGE v2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;700&family=Syne:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1115;
        --surface: #181b21;
        --border: #2a2e35;
        --primary: #f0a500;
        --text: #e6e9ed;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "DM Sans", sans-serif;
        color: var(--text);
        background-color: var(--bg);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 1.5rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .logo {
        font-family: "Syne", sans-serif;
        font-size: 1.5rem;
        color: var(--primary);
        font-weight: 700;
      }

      .progress-bar {
        flex: 1;
        height: 4px;
        background: var(--border);
        border-radius: 2px;
        margin: 0 1rem;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: var(--primary);
        width: 50%;
        transition: width 0.3s ease-in-out;
      }

      .header-right {
        display: flex;
        gap: 1rem;
      }

      .btn-link {
        background: none;
        border: none;
        color: var(--primary);
        cursor: pointer;
        font-size: 0.9rem;
        text-decoration: none;
        padding: 0.5rem 1rem;
        transition: opacity 0.3s;
      }

      .btn-link:hover {
        opacity: 0.8;
      }

      main {
        flex: 1;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      .container {
        max-width: 700px;
        width: 100%;
      }

      h1 {
        font-family: "Syne", sans-serif;
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
        color: var(--text);
      }

      .subtitle {
        font-size: 0.95rem;
        color: var(--text);
        opacity: 0.7;
        margin-bottom: 2rem;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      fieldset {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1.5rem;
        margin: 0;
        min-width: 0;
      }

      legend {
        font-family: "Syne", sans-serif;
        font-size: 1.2rem;
        color: var(--text);
        padding: 0 0.5rem;
        margin-left: -0.5rem;
      }

      .form-group {
        margin-bottom: 1rem;
      }

      .form-group:last-child {
        margin-bottom: 0;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
        color: var(--text);
        font-family: "DM Mono", monospace;
      }

      input[type="text"],
      input[type="email"],
      input[type="tel"] {
        width: 100%;
        padding: 1rem;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 1rem;
      }

      input[type="text"]:focus,
      input[type="email"]:focus,
      input[type="tel"]:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(240, 165, 0, 0.2);
      }

      input[type="text"]:invalid:not(:placeholder-shown),
      input[type="email"]:invalid:not(:placeholder-shown),
      input[type="tel"]:invalid:not(:placeholder-shown) {
        border-color: #ff4444;
      }

      .error-message {
        display: none;
        font-size: 0.8rem;
        color: #ff4444;
        margin-top: 0.25rem;
      }

      .error-message.show {
        display: block;
      }

      footer {
        background: var(--surface);
        border-top: 1px solid var(--border);
        padding: 1.5rem 2rem;
        display: flex;
        justify-content: space-between;
        gap: 1rem;
      }

      button[type="button"],
      button[type="submit"] {
        padding: 1rem 1.5rem;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s;
        font-weight: 600;
      }

      button[type="button"] {
        background: var(--border);
        color: var(--text);
      }

      button[type="button"]:hover:not(:disabled) {
        background: var(--border);
        opacity: 0.8;
      }

      button[type="submit"] {
        background: var(--primary);
        color: #0f1115;
        flex: 1;
      }

      button[type="submit"]:hover:not(:disabled) {
        background-color: #d49200;
      }

      button[type="submit"]:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .spinner {
        display: none;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        margin-right: 0.5rem;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      button[type="submit"].loading .spinner {
        display: inline-block;
      }

      button[type="submit"].loading {
        opacity: 0.8;
      }

      #form-feedback {
        display: none;
        padding: 1rem;
        border-radius: 8px;
        font-size: 0.9rem;
        margin-bottom: 1rem;
      }

      #form-feedback.success {
        background-color: rgba(0, 255, 0, 0.1);
        color: #0f0;
      }

      #form-feedback.error {
        background-color: rgba(255, 0, 0, 0.1);
        color: #ff4444;
      }

      #form-feedback.show {
        display: block;
      }

      .offline-banner {
        display: none;
        background: rgba(255, 165, 0, 0.2);
        border: 1px solid #ffa500;
        color: #ffa500;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        font-size: 0.85rem;
        margin-bottom: 1rem;
      }

      .offline-banner.show {
        display: block;
      }

      @media (max-width: 768px) {
        header {
          flex-direction: column;
          gap: 1rem;
        }

        .header-left {
          width: 100%;
          justify-content: space-between;
        }

        .progress-bar {
          margin: 0;
          flex: 0;
          width: 100%;
        }

        main {
          padding: 1rem;
        }

        footer {
          flex-direction: column;
        }

        button[type="button"],
        button[type="submit"] {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div
        style="
          background-color: #ffcc00;
          color: #333;
          padding: 1rem;
          text-align: center;
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          z-index: 9999;
        "
      >
        Este site requer JavaScript para funcionar corretamente. Por favor,
        habilite o JavaScript em seu navegador.
      </div>
    </noscript>

    <header>
      <div class="header-left">
        <div class="logo">SGE</div>
        <div class="progress-bar">
          <div class="progress-fill"></div>
        </div>
      </div>
      <div class="header-right">
        <a href="#" class="btn-link" id="btn-back">Voltar</a>
      </div>
    </header>

    <main>
      <div class="container">
        <div id="form-feedback"></div>
        <div id="offline-banner" class="offline-banner">
          Você está offline. Verifique sua conexão.
        </div>

        <h1>Dados do Diretor</h1>
        <p class="subtitle">Etapa 2 de 4 - Informações pessoais</p>

        <form id="form-step-2" novalidate>
          <fieldset>
            <legend>Informações Pessoais</legend>
            <div class="form-group">
              <label for="nomeCompleto"
                >Nome Completo
                <span style="color: var(--primary)">*</span></label
              >
              <input
                type="text"
                id="nomeCompleto"
                name="nomeCompleto"
                required
                autocomplete="name"
              />
              <div class="error-message" data-field="nomeCompleto"></div>
            </div>
            <div class="form-group">
              <label for="cpf">CPF</label>
              <input
                type="text"
                id="cpf"
                name="cpf"
                placeholder="000.000.000-00"
                autocomplete="off"
              />
              <div class="error-message" data-field="cpf"></div>
            </div>
            <div class="form-group">
              <label for="email"
                >E-mail Pessoal
                <span style="color: var(--primary)">*</span></label
              >
              <input
                type="email"
                id="email"
                name="email"
                required
                autocomplete="email"
              />
              <div class="error-message" data-field="email"></div>
            </div>
            <div class="form-group">
              <label for="telefone">Telefone Pessoal</label>
              <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="(00) 00000-0000"
                autocomplete="tel-national"
              />
              <div class="error-message" data-field="telefone"></div>
            </div>
          </fieldset>
        </form>
      </div>
    </main>

    <footer>
      <button type="button" id="btn-back-footer">Voltar</button>
      <button type="submit" form="form-step-2" id="btn-next">
        <span class="spinner"></span>
        Salvar e Continuar
      </button>
    </footer>

    <script type="module" src="../../../diretor/js/wizard.js"></script>
  </body>
  <!-- SGE v2.0 • Diretor Registration Wizard • 2026-05-15 -->
</html>
