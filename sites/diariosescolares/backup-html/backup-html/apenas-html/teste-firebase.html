<!doctype html>
<html>
  <head>
    <title>Teste Firebase</title>
  </head>
  <body>
    <h1>Teste de Conexão Firebase</h1>
    <div id="result"></div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
      import { getAuth } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCOug2MkZHwH5rzGXxzlPpVZEu4IHbt0Ck",
        authDomain: "farolescolar.firebaseapp.com",
        databaseURL: "https://farolescolar-default-rtdb.firebaseio.com",
        projectId: "farolescolar",
        storageBucket: "farolescolar.firebasestorage.app",
        messagingSenderId: "31040592917",
        appId: "1:31040592917:web:f90e2f0441c35ed92b421c",
      };

      try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById("result").innerHTML = `
        <p style="color: green">✅ Firebase inicializado com sucesso!</p>
        <p>Auth: ${auth ? "OK" : "FAIL"}</p>
        <p>API Key: ${firebaseConfig.apiKey.substring(0, 10)}...</p>
      `;
      } catch (error) {
        document.getElementById("result").innerHTML = `
        <p style="color: red">❌ Erro: ${error.message}</p>
      `;
      }
    </script>
  </body>
</html>
