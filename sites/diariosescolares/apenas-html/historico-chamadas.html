<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Histórico de Chamadas | SGE Professor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/global.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/sidebar.css" />
    <style>
      .main-content {
        margin-left: 260px;
        padding: 1.5rem;
        min-height: 100vh;
      }
      .content-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
      }
      .filters-container {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 1.5rem;
        margin-bottom: 2rem;
      }
      .filters-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 1rem;
        align-items: flex-end;
      }

      .history-table {
        width: 100%;
        border-collapse: collapse;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        overflow: hidden;
      }
      .history-table th {
        background: var(--surface-light);
        padding: 1rem;
        text-align: left;
        font-size: 0.75rem;
        text-transform: uppercase;
        color: var(--text-secondary);
        letter-spacing: 0.5px;
        position: sticky;
        top: 0;
      }
      .history-table td {
        padding: 1rem;
        border-bottom: 1px solid var(--border);
        font-size: 0.9rem;
      }
      .history-table tr:hover {
        background: var(--surface-light);
      }

      .mono {
        font-family: "DM Mono", monospace;
      }
      .status-pill {
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
        font-size: 0.7rem;
        font-weight: 700;
      }
      .pill-success {
        background: rgba(81, 207, 102, 0.1);
        color: var(--success);
      }
      .pill-danger {
        background: rgba(255, 107, 107, 0.1);
        color: var(--error);
      }

      /* Modal */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(4px);
        z-index: 2000;
        align-items: center;
        justify-content: center;
      }
      .modal.active {
        display: flex;
      }
      .modal-content {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
        width: 90%;
        max-width: 600px;
        max-height: 80vh;
        overflow-y: auto;
        padding: 2rem;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
      }

      #offline-banner {
        display: none;
        background: var(--warning);
        color: var(--bg);
        text-align: center;
        padding: 0.5rem;
        font-weight: 700;
        position: sticky;
        top: 0;
        z-index: 3000;
      }

      @media print {
        .sidebar,
        .filters-container,
        .action-buttons,
        .modal,
        #offline-banner {
          display: none !important;
        }
        .main-content {
          margin-left: 0;
          padding: 0;
        }
        body {
          background: white;
          color: black;
        }
        .history-table {
          border: 1px solid #eee;
        }
        .history-table th {
          background: #f5f5f5;
          color: #333;
          border-bottom: 2px solid #000;
        }
        .history-table td {
          border-bottom: 1px solid #eee;
        }
      }
    </style>
  </head>
  <body>
    <div id="offline-banner">Você está offline. Exibindo dados locais.</div>

    <div class="container">
      <aside class="sidebar">
        <div class="sidebar-logo">SGE v2.0</div>
        <nav class="nav-list">
          <div class="nav-item">
            <a href="dashboard.html" class="nav-link">Dashboard</a>
          </div>
          <div class="nav-item">
            <a href="chamada.html" class="nav-link">Nova Chamada</a>
          </div>
          <div class="nav-item">
            <a href="historico-chamadas.html" class="nav-link active"
              >Histórico</a
            >
          </div>
        </nav>
      </aside>

      <main class="main-content">
        <header class="content-header">
          <h1 class="content-title">Histórico de Chamadas</h1>
          <div class="action-buttons">
            <button class="btn" id="btn-export">Exportar PDF</button>
          </div>
        </header>

        <section class="filters-container" aria-describedby="filter-desc">
          <p id="filter-desc" class="hidden">
            Filtros para busca de chamadas realizadas
          </p>
          <div class="filters-grid">
            <div class="input-group">
              <label class="filter-label">Turma</label>
              <select id="filter-turma" class="input-field">
                <option value="all">Todas as Turmas</option>
              </select>
            </div>
            <div class="input-group">
              <label class="filter-label">Data Início</label>
              <input type="date" id="filter-inicio" class="input-field" />
            </div>
            <div class="input-group">
              <label class="filter-label">Data Fim</label>
              <input type="date" id="filter-fim" class="input-field" />
            </div>
          </div>
        </section>

        <div style="overflow-x: auto">
          <table class="history-table" role="table">
            <thead>
              <tr>
                <th aria-sort="descending">Data</th>
                <th>Turma</th>
                <th>Disciplina</th>
                <th>Presenças</th>
                <th>Faltas</th>
                <th>% Pres.</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <!-- Skeleton Load -->
            </tbody>
          </table>
        </div>
        <div id="sentinel" style="height: 20px"></div>
      </main>
    </div>

    <div id="modal-detalhes" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modal-title">Detalhes da Chamada</h2>
          <button class="btn btn-secondary" id="close-modal">Fechar</button>
        </div>
        <div id="modal-body"></div>
      </div>
    </div>

    <script type="module" src="../professor/js/historico-chamadas.js"></script>
  </body>
</html>
