<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SGE v2.0 | Perfil</title>
    <meta name="description" content="Configurações do professor e conta" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              surface: "#1e293b",
              border: "#334155",
              primary: "#f8fafc",
              secondary: "#94a3b8",
              accent: "#3b82f6",
              success: "#22c55e",
              danger: "#ef4444",
              warning: "#f59e0b",
            },
            animation: {
              "fade-in": "fadeIn 0.3s ease-out",
              "slide-up": "slideUp 0.4s ease-out",
            },
            keyframes: {
              fadeIn: { "0%": { opacity: "0" }, "100%": { opacity: "1" } },
              slideUp: {
                "0%": { transform: "translateY(10px)", opacity: "0" },
                "100%": { transform: "translateY(0)", opacity: "1" },
              },
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
      body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
      }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
      .glass-effect {
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .btn-toggle.active {
        background-color: #3b82f6;
        color: white;
        border-color: #3b82f6;
      }
    </style>
  </head>

  <body class="bg-slate-900 text-primary antialiased overflow-x-hidden">
    <div class="flex h-screen overflow-hidden">

      <aside
        id="sidebar"
        class="fixed inset-y-0 left-0 z-30 w-64 bg-surface border-r border-border transform -translate-x-full transition-transform duration-300 lg:translate-x-0 lg:static lg:inset-auto"
      >
        <div
          class="flex items-center justify-between h-16 px-6 border-b border-border"
        >
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-accent flex items-center justify-center font-bold text-white">
              SG
            </div>
            <span class="font-bold text-lg tracking-tight">Diários Escolares</span>
          </div>
          <button
            id="sidebar-close"
            class="lg:hidden text-secondary hover:text-primary"
          >
            <i class="ph ph-x text-xl"></i>
          </button>
        </div>

        <nav class="p-4 space-y-1 overflow-y-auto h-[calc(100%-4rem)] scrollbar-hide">
          <p class="px-3 text-xs font-semibold text-secondary uppercase tracking-wider mb-2">
            Menu Principal
          </p>

          <a href="index.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-secondary hover:bg-slate-800 hover:text-primary transition-colors">
            <i class="ph ph-squares-four text-lg"></i> Dashboard
          </a>
          <a href="chamada.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-secondary hover:bg-slate-800 hover:text-primary transition-colors">
            <i class="ph ph-clipboard-text text-lg"></i> Chamada
          </a>
          <a href="notas.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-secondary hover:bg-slate-800 hover:text-primary transition-colors">
            <i class="ph ph-chart-line-up text-lg"></i> Notas
          </a>
          <a href="historico-chamadas.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-secondary hover:bg-slate-800 hover:text-primary transition-colors">
            <i class="ph ph-clock-counter-clockwise text-lg"></i> Histórico
          </a>
          <a href="bilhetes.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-secondary hover:bg-slate-800 hover:text-primary transition-colors">
            <i class="ph ph-envelope-simple text-lg"></i> Bilhetes
          </a>
          <a href="alunos.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-secondary hover:bg-slate-800 hover:text-primary transition-colors">
            <i class="ph ph-users-three text-lg"></i> Alunos
          </a>
          <a href="horario.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-secondary hover:bg-slate-800 hover:text-primary transition-colors">
            <i class="ph ph-calendar-dots text-lg"></i> Horário
          </a>

          <div class="pt-4 mt-4 border-t border-border">
            <p class="px-3 text-xs font-semibold text-secondary uppercase tracking-wider mb-2">
              Sistema
            </p>
            <a href="perfil.html" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-secondary hover:bg-slate-800 hover:text-primary transition-colors">
              <i class="ph ph-gear text-lg"></i> Configurações
            </a>
          </div>
        </nav>
      </aside>

      <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

        <header class="h-16 bg-surface/80 glass-effect border-b border-border flex items-center justify-between px-4 lg:px-6 sticky top-0 z-20">
          <div class="flex items-center gap-4">
            <button
              id="sidebar-toggle"
              class="lg:hidden p-2 rounded-lg text-secondary hover:bg-slate-800 hover:text-primary transition-colors"
            >
              <i class="ph ph-list text-xl"></i>
            </button>
            <div class="hidden sm:block">
              <h1 class="text-sm font-medium text-secondary">Conta</h1>
              <h2 class="text-lg font-bold text-primary">Meu Perfil</h2>
            </div>
          </div>

          <div class="flex items-center gap-3">
            <button
              class="relative p-2 rounded-lg text-secondary hover:bg-slate-800 hover:text-primary transition-colors"
              id="btn-notifications"
            >
              <i class="ph ph-bell text-xl"></i>
              <span id="badge-notifications" class="absolute top-1.5 right-1.5 w-2 h-2 bg-danger rounded-full hidden"></span>
            </button>

            <div class="flex items-center gap-3 pl-3 border-l border-border">
              <div class="text-right hidden md:block">
                <p id="user-name" class="text-sm font-semibold text-primary">Professor</p>
                <p id="user-discipline" class="text-xs text-secondary">Disciplina</p>
              </div>
              <div id="user-initials" class="w-9 h-9 rounded-full bg-accent/20 border border-accent/30 flex items-center justify-center text-accent font-bold text-sm cursor-pointer hover:bg-accent/30 transition-colors">
                P
              </div>
              <button
                id="btn-logout"
                class="p-2 rounded-lg text-secondary hover:bg-danger/10 hover:text-danger transition-colors"
                title="Sair"
              >
                <i class="ph ph-sign-out text-xl"></i>
              </button>
            </div>
          </div>
        </header>

        <main class="flex-1 overflow-y-auto p-4 lg:p-6 scrollbar-hide space-y-6">
          <section class="bg-surface border border-border rounded-xl p-6 shadow-sm">
            <h3 class="text-lg font-bold text-primary mb-4">Dados da conta</h3>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm text-secondary mb-2">Nome</label>
                <input type="text" value="Professor" class="w-full bg-slate-900 border border-border rounded-lg px-3 py-2 text-primary" />
              </div>
              <div>
                <label class="block text-sm text-secondary mb-2">Email</label>
                <input type="email" value="professor@escola.com" class="w-full bg-slate-900 border border-border rounded-lg px-3 py-2 text-primary" />
              </div>
            </div>
          </section>

          <section class="bg-surface border border-border rounded-xl p-6 shadow-sm">
            <h3 class="text-lg font-bold text-primary mb-4">Segurança</h3>
            <div class="flex gap-3 flex-col sm:flex-row">
              <button class="px-4 py-2 rounded-lg bg-accent hover:bg-blue-600 text-white text-sm font-semibold">Alterar senha</button>
              <button class="px-4 py-2 rounded-lg border border-border text-sm font-medium text-secondary hover:bg-slate-800 hover:text-primary transition-colors">Encerrar sessões</button>
            </div>
          </section>
        </main>
      </div>
    </div>
    <div id="toast-container" class="fixed bottom-6 right-6 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    <script type="module" src="./js/professor-shell.js"></script>
  </body>
</html>
