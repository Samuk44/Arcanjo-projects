<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu Perfil | Diários Escolares</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/global.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/sidebar.css" />
    <style>
      .main-content {
        margin-left: 260px;
        padding: 1.5rem;
      }
      .tabs {
        display: flex;
        gap: 1rem;
        border-bottom: 1px solid var(--border);
        margin-bottom: 2rem;
      }
      .tab-btn {
        padding: 0.75rem 1.5rem;
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        font-weight: 600;
        border-bottom: 2px solid transparent;
        transition: all 0.2s;
      }
      .tab-btn.active {
        color: var(--primary);
        border-bottom-color: var(--primary);
      }
      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
        animation: fadeIn 0.3s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .profile-header {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        margin-bottom: 2rem;
      }
      .avatar-circle {
        width: 80px;
        height: 80px;
        background: var(--primary);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: 700;
        color: var(--bg);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <img src="../assets/img/logo.png" alt="Diários Escolares" class="h-10 w-auto object-contain" />
        <nav class="nav-list">
          <div class="nav-item">
            <a href="index.html" class="nav-link">Dashboard</a>
          </div>
          <div class="nav-item">
            <a href="configuracoes.html" class="nav-link">Configurações</a>
          </div>
          <div class="nav-item">
            <a href="perfil.html" class="nav-link active">Meu Perfil</a>
          </div>
        </nav>
      </aside>

      <main class="main-content">
        <div class="profile-header">
          <div class="avatar-circle" id="user-initials">--</div>
          <div>
            <h1 id="user-display-name">Carregando...</h1>
            <p
              class="badge"
              style="background: rgba(59, 130, 246, 0.1); color: var(--primary)"
            >
              Diretor
            </p>
          </div>
        </div>

        <div class="tabs">
          <button class="tab-btn active" data-tab="dados">
            Dados Pessoais
          </button>
          <button class="tab-btn" data-tab="seguranca">Segurança</button>
          <button class="tab-btn" data-tab="prefs">Preferências</button>
        </div>

        <div id="dados" class="tab-content active">
          <div class="card" style="max-width: 600px">
            <div class="input-group">
              <label>Nome Completo</label>
              <input type="text" id="perfil-nome" class="input-field" />
            </div>
            <div class="input-group">
              <label>E-mail (Login)</label>
              <input
                type="email"
                id="perfil-email"
                class="input-field"
                readonly
                style="opacity: 0.6"
              />
            </div>
            <div class="input-group">
              <label>Telefone</label>
              <input type="text" id="perfil-tel" class="input-field" />
            </div>
            <button class="btn" id="btn-save-perfil">Atualizar Perfil</button>
          </div>
        </div>

        <div id="seguranca" class="tab-content">
          <div class="card" style="max-width: 600px">
            <h2 style="margin-bottom: 1rem">Alterar Senha</h2>
            <div class="input-group">
              <label>Nova Senha</label>
              <input type="password" id="new-pass" class="input-field" />
            </div>
            <button class="btn btn-secondary" id="btn-change-pass">
              Redefinir Senha
            </button>
          </div>
        </div>

        <div id="prefs" class="tab-content">
          <div class="card" style="max-width: 600px">
            <div
              class="input-group"
              style="
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
              "
            >
              <label>Notificações por E-mail</label>
              <input type="checkbox" id="pref-notif" checked />
            </div>
            <div
              class="input-group"
              style="
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                margin-top: 1rem;
              "
            >
              <label>Modo Silencioso (22h - 06h)</label>
              <input type="checkbox" id="pref-silence" />
            </div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="./js/perfil.js"></script>
  </body>
</html>
