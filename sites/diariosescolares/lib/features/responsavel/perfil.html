<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Meu Perfil | Diários Escolares</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: { extend: {
          colors: { bg:"#f8fafc", card:"#ffffff", border:"#e2e8f0", primary:"#3b82f6", text:"#0f172a", muted:"#64748b", danger:"#ef4444", success:"#22c55e" },
          fontFamily: { sans:["DM Sans","sans-serif"], display:["Syne","sans-serif"] },
        }},
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Syne:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      .nav-active{background:rgba(59,130,246,.15);color:#3b82f6;font-weight:600}
      .nav-item{color:#94a3b8;transition:background .15s,color .15s}
      .nav-item:hover{color:#0f172a;background:rgba(59,130,246,.05)}
      .nav-section{padding:.75rem 1rem .375rem;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(148,163,184,.5)}
      .badge-success{background:#f0fdf4;color:#22c55e}
      .toast{animation:toastIn .25s cubic-bezier(.4,0,.2,1)}
      @keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
    </style>
  </head>
  <body class="bg-bg text-text font-sans antialiased h-screen flex overflow-hidden">

    <aside class="w-64 bg-card border-r border-border flex-col hidden md:flex shrink-0">
      <div class="p-6 border-b border-border">
        <img src="../assets/img/logo.png" alt="Diários Escolares" class="h-10 w-auto object-contain" />
        <p class="text-xs text-muted mt-1">Painel do Responsável</p>
      </div>
      <nav class="flex-1 overflow-y-auto py-4">
        <ul class="px-3">
          <li><a href="index.html" class="nav-item block px-4 py-2.5 rounded-xl text-sm">Dashboard</a></li>
          <li class="nav-section">Acadêmico</li>
          <li><a href="boletim.html" class="nav-item block px-4 py-2.5 rounded-xl text-sm">Boletim</a></li>
          <li><a href="horario.html" class="nav-item block px-4 py-2.5 rounded-xl text-sm">Horário</a></li>
          <li class="nav-section">Comunicação</li>
          <li><a href="comunicados.html" class="nav-item block px-4 py-2.5 rounded-xl text-sm">Comunicados</a></li>
          <li class="nav-section">Financeiro</li>
          <li><a href="financeiro.html" class="nav-item block px-4 py-2.5 rounded-xl text-sm">Boletos</a></li>
          <li class="nav-section">Sistema</li>
          <li><a href="perfil.html" class="nav-active block px-4 py-2.5 rounded-xl text-sm">Meu Perfil</a></li>
        </ul>
      </nav>
      <div class="p-4 border-t border-border">
        <button id="btn-logout" class="flex items-center gap-2 w-full text-sm text-danger hover:text-red-400 transition-colors font-medium">
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Sair
        </button>
      </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
      <header class="h-16 bg-card border-b border-border flex items-center justify-between px-6 sticky top-0 z-40 shrink-0">
        <h2 class="font-display text-base font-semibold text-text">Meu Perfil</h2>
        <div class="flex items-center gap-3">
          <span class="text-sm text-muted" id="topbar-greeting">Olá</span>
          <div id="topbar-avatar" class="w-8 h-8 rounded-full bg-primary flex items-center justify-center font-bold text-white text-sm">R</div>
        </div>
      </header>

      <div class="flex-1 overflow-y-auto p-4 md:p-8">
        <div class="mb-6">
          <h1 class="font-display text-2xl font-bold text-text">Meu Perfil</h1>
          <p class="text-sm text-muted mt-1">Gerencie seus dados pessoais</p>
        </div>

        <div class="grid gap-6 lg:grid-cols-2">
          <div class="bg-card rounded-2xl border border-border p-6">
            <h3 class="font-display text-base font-semibold text-text mb-5">Dados Pessoais</h3>
            <form id="form-perfil" class="space-y-4" novalidate>
              <div>
                <label for="input-nome" class="block text-xs font-semibold text-muted uppercase tracking-wider mb-1.5">Nome completo</label>
                <input id="input-nome" type="text" required autocomplete="name"
                  class="w-full px-4 py-2.5 rounded-xl border border-border bg-bg text-text text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-primary transition" />
              </div>
              <div>
                <label for="input-email" class="block text-xs font-semibold text-muted uppercase tracking-wider mb-1.5">E-mail</label>
                <input id="input-email" type="email" disabled autocomplete="email"
                  class="w-full px-4 py-2.5 rounded-xl border border-border bg-bg/50 text-muted text-sm cursor-not-allowed" />
              </div>
              <div>
                <label for="input-telefone" class="block text-xs font-semibold text-muted uppercase tracking-wider mb-1.5">Telefone</label>
                <input id="input-telefone" type="tel" autocomplete="tel"
                  class="w-full px-4 py-2.5 rounded-xl border border-border bg-bg text-text text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-primary transition" />
              </div>
              <div>
                <label for="input-cpf" class="block text-xs font-semibold text-muted uppercase tracking-wider mb-1.5">CPF</label>
                <input id="input-cpf" type="text" disabled autocomplete="off"
                  class="w-full px-4 py-2.5 rounded-xl border border-border bg-bg/50 text-muted text-sm cursor-not-allowed" />
              </div>
              <div class="flex items-center gap-6 pt-1">
                <div>
                  <p class="text-xs font-semibold text-muted uppercase tracking-wider mb-1">Perfil</p>
                  <span id="display-role" class="text-sm font-medium text-text">—</span>
                </div>
                <div>
                  <p class="text-xs font-semibold text-muted uppercase tracking-wider mb-1">Status</p>
                  <span id="display-status" class="badge-success px-2 py-1 rounded-lg text-xs font-bold">—</span>
                </div>
              </div>
              <button type="submit"
                class="w-full px-5 py-3 rounded-xl bg-primary text-white text-sm font-semibold hover:bg-blue-700 transition-colors">
                Salvar alterações
              </button>
            </form>
          </div>

          <div class="bg-card rounded-2xl border border-border p-6">
            <h3 class="font-display text-base font-semibold text-text mb-5">Alterar Senha</h3>
            <form id="form-senha" class="space-y-4" novalidate>
              <div>
                <label for="input-senha-atual" class="block text-xs font-semibold text-muted uppercase tracking-wider mb-1.5">Senha atual</label>
                <input id="input-senha-atual" type="password" autocomplete="current-password"
                  class="w-full px-4 py-2.5 rounded-xl border border-border bg-bg text-text text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-primary transition" />
              </div>
              <div>
                <label for="input-nova-senha" class="block text-xs font-semibold text-muted uppercase tracking-wider mb-1.5">Nova senha</label>
                <input id="input-nova-senha" type="password" autocomplete="new-password"
                  class="w-full px-4 py-2.5 rounded-xl border border-border bg-bg text-text text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-primary transition" />
                <p class="text-xs text-muted mt-1">Mínimo de 8 caracteres</p>
              </div>
              <div>
                <label for="input-confirmar-senha" class="block text-xs font-semibold text-muted uppercase tracking-wider mb-1.5">Confirmar nova senha</label>
                <input id="input-confirmar-senha" type="password" autocomplete="new-password"
                  class="w-full px-4 py-2.5 rounded-xl border border-border bg-bg text-text text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-primary transition" />
              </div>
              <button type="submit"
                class="w-full px-5 py-3 rounded-xl bg-slate-600 text-white text-sm font-semibold hover:bg-slate-700 transition-colors">
                Alterar senha
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>

    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none" aria-live="polite"></div>
    <script type="module" src="./js/perfil.js"></script>
  </body>
</html>
