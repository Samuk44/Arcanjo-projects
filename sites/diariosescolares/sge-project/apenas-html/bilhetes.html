<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <meta name="theme-color" content="#0f1115" />
    <meta name="robots" content="noindex" />
    <title>SGE v2.0 - Bilhetes</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&family=Syne:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1115;
        --surface: #181b21;
        --surface-alt: #1f2329;
        --primary: #f0a500;
        --primary-hover: #e09500;
        --text: #e6e9ed;
        --text-secondary: #a8adb5;
        --text-tertiary: #7a8089;
        --border: #2d3139;
        --success: #22c55e;
        --danger: #f43f5e;
        --warning: #facc15;
        --info: #3b82f6;
        --radius: 0.5rem;
        --transition: 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          "DM Sans",
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }

      .container {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 100vh;
      }

      .sidebar {
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 2.5rem;
        font-weight: 700;
        color: var(--primary);
        font-size: 1.25rem;
      }

      .sidebar-logo {
        width: 32px;
        height: 32px;
        background: var(--primary);
        border-radius: var(--radius);
        display: grid;
        place-items: center;
        color: var(--bg);
        font-weight: 900;
      }

      .sidebar-nav {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .sidebar-nav a {
        padding: 0.75rem 1rem;
        border-radius: var(--radius);
        text-decoration: none;
        color: var(--text-secondary);
        transition: all var(--transition);
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.95rem;
      }

      .sidebar-nav a:hover,
      .sidebar-nav a.active {
        background: var(--surface-alt);
        color: var(--primary);
      }

      .main-content {
        padding: 2rem;
        overflow-y: auto;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 2rem;
      }

      .header h1 {
        font-family: "Syne", sans-serif;
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .header p {
        color: var(--text-secondary);
        font-size: 0.95rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        border-radius: var(--radius);
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--transition);
        border: 1px solid transparent;
        font-family: inherit;
      }

      .btn-primary {
        background: var(--primary);
        color: var(--bg);
      }

      .btn-primary:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
      }

      .filters {
        display: flex;
        gap: 1rem;
        margin-bottom: 2rem;
        flex-wrap: wrap;
      }

      select,
      input[type="search"] {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.6rem 1rem;
        border-radius: var(--radius);
        font-family: inherit;
        font-size: 0.9rem;
        transition: all var(--transition);
      }

      select:focus,
      input[type="search"]:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(240, 165, 0, 0.1);
      }

      .bilhetes-feed {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-bottom: 2rem;
        role: "feed";
      }

      .bilhete-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.5rem;
        transition: all var(--transition);
        animation: slideIn 0.4s var(--transition);
        cursor: pointer;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(-20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .bilhete-card:hover {
        border-color: var(--primary);
        background: rgba(240, 165, 0, 0.02);
      }

      .bilhete-card.lido {
        opacity: 0.7;
      }

      .bilhete-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 1rem;
      }

      .bilhete-info {
        flex: 1;
      }

      .bilhete-remetente {
        font-size: 0.85rem;
        color: var(--text-tertiary);
        font-family: "DM Mono", monospace;
        margin-bottom: 0.25rem;
      }

      .bilhete-assunto {
        font-family: "Syne", sans-serif;
        font-size: 1.125rem;
        font-weight: 700;
        color: var(--text);
      }

      .bilhete-meta {
        display: flex;
        gap: 1rem;
        align-items: center;
        margin-top: 0.5rem;
      }

      .bilhete-data {
        font-size: 0.8rem;
        color: var(--text-tertiary);
        font-family: "DM Mono", monospace;
      }

      .badge {
        display: inline-flex;
        padding: 0.2rem 0.6rem;
        border-radius: 2rem;
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .badge-enviado {
        background: rgba(59, 130, 246, 0.1);
        color: var(--info);
      }
      .badge-entregue {
        background: rgba(34, 197, 94, 0.1);
        color: var(--success);
      }
      .badge-lido {
        background: rgba(34, 197, 94, 0.2);
        color: var(--success);
      }
      .badge-urgente {
        background: rgba(250, 204, 21, 0.1);
        color: var(--warning);
      }

      .bilhete-preview {
        color: var(--text-secondary);
        font-size: 0.95rem;
        line-height: 1.5;
        margin: 1rem 0;
        max-height: 60px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .bilhete-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
      }

      .bilhete-actions {
        display: flex;
        gap: 0.75rem;
      }

      .btn-small {
        padding: 0.5rem 1rem;
        font-size: 0.8rem;
        background: var(--surface-alt);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: var(--radius);
        cursor: pointer;
        transition: all var(--transition);
      }

      .btn-small:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(12px);
        display: none;
        place-items: center;
        z-index: 1000;
        padding: 1.5rem;
      }

      .modal-overlay.active {
        display: grid;
      }

      .modal {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
        width: 100%;
        max-width: 600px;
        max-height: 90vh;
        overflow-y: auto;
        animation: modalIn var(--transition);
      }

      @keyframes modalIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .modal-header {
        padding: 1.5rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .modal-body {
        padding: 2rem;
      }

      .modal-footer {
        padding: 1.5rem;
        background: var(--surface-alt);
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: flex-end;
        gap: 1rem;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      .form-label {
        display: block;
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--text-tertiary);
        margin-bottom: 0.5rem;
        letter-spacing: 0.05em;
      }

      input[type="text"],
      textarea,
      select {
        width: 100%;
        background: var(--surface-alt);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.75rem 1rem;
        border-radius: var(--radius);
        font-family: inherit;
        font-size: 0.95rem;
      }

      textarea {
        resize: vertical;
        min-height: 120px;
      }

      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(240, 165, 0, 0.1);
      }

      .char-count {
        font-size: 0.75rem;
        color: var(--text-tertiary);
        margin-top: 0.25rem;
        font-family: "DM Mono", monospace;
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
      }

      .file-input-wrapper {
        position: relative;
        overflow: hidden;
        display: inline-block;
      }

      input[type="file"] {
        position: absolute;
        left: -9999px;
      }

      .file-label {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 1rem;
        background: var(--surface-alt);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        cursor: pointer;
        font-size: 0.9rem;
        transition: all var(--transition);
      }

      .file-label:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      .file-preview {
        margin-top: 1rem;
        padding: 1rem;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-size: 0.85rem;
      }

      #toast-container {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .toast {
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 4px solid var(--primary);
        padding: 1rem 1.5rem;
        border-radius: var(--radius);
        color: var(--text);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        min-width: 320px;
        display: flex;
        align-items: center;
        gap: 1rem;
        animation: toastIn 0.4s var(--transition);
      }

      @keyframes toastIn {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      .toast.success {
        border-left-color: var(--success);
      }
      .toast.error {
        border-left-color: var(--danger);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
        }
        .sidebar {
          display: none;
        }
        .header {
          flex-direction: column;
          gap: 1rem;
        }
        .filters {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">S</div>
          <span>SGE v2.0</span>
        </div>
        <nav class="sidebar-nav">
          <a href="#"><span>📊</span> Dashboard</a>
          <a href="#"><span>📋</span> Chamada</a>
          <a href="#"><span>📝</span> Notas</a>
          <a href="#" class="active"><span>💬</span> Bilhetes</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="header">
          <div>
            <h1>Bilhetes</h1>
            <p>Comunicação com responsáveis e alunos</p>
          </div>
          <button class="btn btn-primary" id="btn-novo-bilhete">
            + Novo Bilhete
          </button>
        </header>

        <div class="filters">
          <select id="filter-turma" aria-label="Filtrar por turma">
            <option value="">Todas as turmas</option>
          </select>
          <select id="filter-status" aria-label="Filtrar por status">
            <option value="">Todos os status</option>
            <option value="enviado">Enviado</option>
            <option value="entregue">Entregue</option>
            <option value="lido">Lido</option>
          </select>
          <input
            type="search"
            id="search-bilhetes"
            placeholder="Buscar bilhete..."
            aria-label="Buscar bilhete"
          />
        </div>

        <section
          class="bilhetes-feed"
          id="lista-bilhetes"
          role="feed"
          aria-label="Lista de bilhetes"
        >
          <div
            style="
              text-align: center;
              padding: 3rem;
              color: var(--text-tertiary);
            "
          >
            Carregando bilhetes...
          </div>
        </section>
      </main>
    </div>

    <!-- Modal Novo Bilhete -->
    <div id="modal-novo" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h2
            style="
              font-family: &quot;Syne&quot;, sans-serif;
              font-size: 1.25rem;
              font-weight: 700;
            "
          >
            Novo Bilhete
          </h2>
          <button class="btn-small" onclick="closeModal('modal-novo')">
            ✕
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Destinatário</label>
            <select
              id="input-destinatario"
              aria-label="Selecione o destinatário"
            >
              <option value="">Selecione...</option>
              <option value="turma">Turma Inteira</option>
              <option value="aluno">Aluno Específico</option>
              <option value="responsavel">Responsável</option>
            </select>
          </div>
          <div class="form-group" id="turma-select-group" style="display: none">
            <label class="form-label">Turma</label>
            <select id="input-turma"></select>
          </div>
          <div class="form-group">
            <label class="form-label">Assunto</label>
            <input
              type="text"
              id="input-assunto"
              placeholder="Ex: Resultado da Prova"
              maxlength="100"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Mensagem</label>
            <textarea
              id="input-mensagem"
              placeholder="Escreva o conteúdo do bilhete..."
              maxlength="2000"
            ></textarea>
            <div class="char-count"><span id="char-count">0</span>/2000</div>
          </div>
          <div class="form-group">
            <div class="checkbox-group">
              <input
                type="checkbox"
                id="input-urgente"
                aria-label="Marcar como urgente"
              />
              <label for="input-urgente" style="margin: 0; font-size: 0.9rem"
                >Marcar como urgente</label
              >
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Anexo (Opcional)</label>
            <div class="file-input-wrapper">
              <input
                type="file"
                id="input-anexo"
                accept="image/*,application/pdf"
                aria-label="Selecionar arquivo"
              />
              <label for="input-anexo" class="file-label"
                >📎 Escolher arquivo</label
              >
            </div>
            <div id="file-preview"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-small" onclick="closeModal('modal-novo')">
            Cancelar
          </button>
          <button class="btn btn-primary" id="btn-enviar-bilhete">
            Enviar Bilhete
          </button>
        </div>
      </div>
    </div>

    <!-- Modal Visualizar Bilhete -->
    <div id="modal-visualizar" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h2
            style="
              font-family: &quot;Syne&quot;, sans-serif;
              font-size: 1.25rem;
              font-weight: 700;
            "
            id="modal-assunto"
          >
            Bilhete
          </h2>
          <button class="btn-small" onclick="closeModal('modal-visualizar')">
            ✕
          </button>
        </div>
        <div class="modal-body" id="modal-conteudo"></div>
        <div class="modal-footer">
          <button class="btn-small" onclick="closeModal('modal-visualizar')">
            Fechar
          </button>
        </div>
      </div>
    </div>

    <div id="toast-container"></div>

    <script type="module" src="../professor/js/bilhetes.js"></script>
  </body>
</html>
