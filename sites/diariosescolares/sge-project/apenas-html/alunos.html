<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <meta name="theme-color" content="#0f1115" />
    <meta name="robots" content="noindex" />
    <title>SGE v2.0 - Alunos</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&family=Syne:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1115;
        --surface: #181b21;
        --surface-alt: #1f2329;
        --primary: #f0a500;
        --primary-hover: #e09500;
        --text: #e6e9ed;
        --text-secondary: #a8adb5;
        --text-tertiary: #7a8089;
        --border: #2d3139;
        --success: #22c55e;
        --danger: #f43f5e;
        --warning: #facc15;
        --info: #3b82f6;
        --radius: 0.5rem;
        --transition: 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          "DM Sans",
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }

      .container {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 100vh;
      }

      .sidebar {
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 2.5rem;
        font-weight: 700;
        color: var(--primary);
        font-size: 1.25rem;
      }

      .sidebar-logo {
        width: 32px;
        height: 32px;
        background: var(--primary);
        border-radius: var(--radius);
        display: grid;
        place-items: center;
        color: var(--bg);
        font-weight: 900;
      }

      .sidebar-nav {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .sidebar-nav a {
        padding: 0.75rem 1rem;
        border-radius: var(--radius);
        text-decoration: none;
        color: var(--text-secondary);
        transition: all var(--transition);
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.95rem;
      }

      .sidebar-nav a:hover,
      .sidebar-nav a.active {
        background: var(--surface-alt);
        color: var(--primary);
      }

      .main-content {
        padding: 2rem;
        overflow-y: auto;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 2rem;
      }

      .header h1 {
        font-family: "Syne", sans-serif;
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .header p {
        color: var(--text-secondary);
        font-size: 0.95rem;
      }

      .controls {
        display: flex;
        gap: 1rem;
        margin-bottom: 2rem;
        flex-wrap: wrap;
      }

      select,
      input[type="search"] {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.6rem 1rem;
        border-radius: var(--radius);
        font-family: inherit;
        font-size: 0.9rem;
        transition: all var(--transition);
      }

      select:focus,
      input[type="search"]:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(240, 165, 0, 0.1);
      }

      .table-wrapper {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow-x: auto;
        margin-bottom: 2rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      th {
        background: var(--surface-alt);
        padding: 1rem;
        text-align: left;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        user-select: none;
        transition: all var(--transition);
      }

      th:hover {
        background: rgba(240, 165, 0, 0.05);
      }

      td {
        padding: 1rem;
        border-bottom: 1px solid var(--border);
      }

      tr:hover {
        background: rgba(240, 165, 0, 0.02);
      }

      .aluno-nome {
        font-weight: 600;
        cursor: pointer;
        color: var(--primary);
        transition: all var(--transition);
      }

      .aluno-nome:hover {
        text-decoration: underline;
      }

      .freq-bar-container {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .freq-bar {
        flex: 1;
        height: 8px;
        background: var(--border);
        border-radius: 4px;
        overflow: hidden;
        min-width: 100px;
      }

      .freq-bar-fill {
        height: 100%;
        transition: width 0.6s var(--transition);
        background: var(--success);
      }

      .freq-bar-fill.warning {
        background: var(--warning);
      }

      .freq-bar-fill.danger {
        background: var(--danger);
      }

      .freq-percent {
        font-family: "DM Mono", monospace;
        font-weight: 700;
        min-width: 40px;
        text-align: right;
        font-size: 0.85rem;
      }

      .status-badge {
        display: inline-flex;
        padding: 0.25rem 0.75rem;
        border-radius: 2rem;
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .status-ok {
        background: rgba(34, 197, 94, 0.1);
        color: var(--success);
      }
      .status-atencao {
        background: rgba(250, 204, 21, 0.1);
        color: var(--warning);
      }
      .status-critico {
        background: rgba(244, 63, 94, 0.1);
        color: var(--danger);
      }

      .action-btn {
        padding: 0.4rem 0.8rem;
        background: var(--surface-alt);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.85rem;
        transition: all var(--transition);
      }

      .action-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(12px);
        display: none;
        place-items: center;
        z-index: 1000;
        padding: 1.5rem;
      }

      .modal-overlay.active {
        display: grid;
      }

      .modal {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
        width: 100%;
        max-width: 600px;
        max-height: 90vh;
        overflow-y: auto;
        animation: modalIn var(--transition);
      }

      @keyframes modalIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .modal-header {
        padding: 1.5rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .modal-body {
        padding: 2rem;
      }

      .modal-footer {
        padding: 1.5rem;
        background: var(--surface-alt);
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: flex-end;
        gap: 1rem;
      }

      .detail-section {
        margin-bottom: 2rem;
      }

      .detail-title {
        font-family: "Syne", sans-serif;
        font-size: 1rem;
        font-weight: 700;
        margin-bottom: 1rem;
        color: var(--primary);
      }

      .detail-item {
        display: flex;
        justify-content: space-between;
        padding: 0.75rem 0;
        border-bottom: 1px solid var(--border);
      }

      .detail-label {
        color: var(--text-tertiary);
        font-size: 0.85rem;
      }

      .detail-value {
        font-weight: 600;
        font-family: "DM Mono", monospace;
      }

      .skeleton {
        background: linear-gradient(
          90deg,
          var(--surface-alt) 25%,
          var(--border) 50%,
          var(--surface-alt) 75%
        );
        background-size: 200% 100%;
        animation: skeleton 1.5s infinite;
      }

      @keyframes skeleton {
        from {
          background-position: 200% 0;
        }
        to {
          background-position: -200% 0;
        }
      }

      #toast-container {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .toast {
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 4px solid var(--primary);
        padding: 1rem 1.5rem;
        border-radius: var(--radius);
        color: var(--text);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        min-width: 320px;
        display: flex;
        align-items: center;
        gap: 1rem;
        animation: toastIn 0.4s var(--transition);
      }

      @keyframes toastIn {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
        }
        .sidebar {
          display: none;
        }
        .header {
          flex-direction: column;
          gap: 1rem;
        }
        .controls {
          flex-direction: column;
        }
        table {
          font-size: 0.8rem;
        }
        td,
        th {
          padding: 0.75rem 0.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">S</div>
          <span>SGE v2.0</span>
        </div>
        <nav class="sidebar-nav">
          <a href="#"><span>📊</span> Dashboard</a>
          <a href="#"><span>📋</span> Chamada</a>
          <a href="#" class="active"><span>👥</span> Alunos</a>
          <a href="#"><span>📝</span> Notas</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="header">
          <div>
            <h1>Alunos</h1>
            <p>Visualize frequência, desempenho e métricas</p>
          </div>
        </header>

        <div class="controls">
          <select id="select-turma" aria-label="Selecione a turma">
            <option value="">Carregando turmas...</option>
          </select>
          <input
            type="search"
            id="search-alunos"
            placeholder="Buscar por nome..."
            aria-label="Buscar aluno"
          />
        </div>

        <div class="table-wrapper">
          <table role="table" aria-label="Lista de alunos">
            <thead>
              <tr>
                <th onclick="sortTable('nome')" aria-sort="none">Nome</th>
                <th onclick="sortTable('frequencia')" aria-sort="none">
                  Frequência
                </th>
                <th onclick="sortTable('ultimaFalta')" aria-sort="none">
                  Última Falta
                </th>
                <th onclick="sortTable('media')" aria-sort="none">Média</th>
                <th onclick="sortTable('status')" aria-sort="none">Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-alunos">
              <tr>
                <td colspan="6" style="text-align: center; padding: 2rem">
                  <div class="skeleton" style="height: 20px"></div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </main>
    </div>

    <!-- Modal Detalhes Aluno -->
    <div id="modal-detalhes" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h2
            style="
              font-family: &quot;Syne&quot;, sans-serif;
              font-size: 1.25rem;
              font-weight: 700;
            "
            id="modal-nome"
          >
            Detalhes do Aluno
          </h2>
          <button
            style="
              padding: 0.4rem 0.8rem;
              background: var(--surface-alt);
              border: 1px solid var(--border);
              color: var(--text);
              border-radius: 4px;
              cursor: pointer;
            "
            onclick="closeModal('modal-detalhes')"
          >
            ✕
          </button>
        </div>
        <div class="modal-body" id="modal-conteudo"></div>
        <div class="modal-footer">
          <button
            style="
              padding: 0.6rem 1.25rem;
              background: var(--surface-alt);
              border: 1px solid var(--border);
              color: var(--text);
              border-radius: var(--radius);
              cursor: pointer;
            "
            onclick="closeModal('modal-detalhes')"
          >
            Fechar
          </button>
          <button
            style="
              padding: 0.6rem 1.25rem;
              background: var(--primary);
              color: var(--bg);
              border: none;
              border-radius: var(--radius);
              cursor: pointer;
              font-weight: 600;
            "
            id="btn-enviar-bilhete"
          >
            📩 Enviar Bilhete
          </button>
        </div>
      </div>
    </div>

    <div id="toast-container"></div>

    <script type="module" src="../professor/js/alunos.js"></script>
  </body>
</html>
