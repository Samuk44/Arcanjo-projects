<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Configurações da Escola | SGE Diretor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/global.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/sidebar.css" />
    <style>
      .main-content {
        margin-left: 260px;
        padding: 1.5rem;
      }
      .config-grid {
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 2rem;
      }
      .logo-preview {
        width: 100%;
        height: 200px;
        background: var(--surface-light);
        border: 2px dashed var(--border);
        border-radius: 0.75rem;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }
      .logo-preview img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      .logo-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0, 0, 0, 0.6);
        padding: 0.5rem;
        text-align: center;
        font-size: 0.75rem;
        cursor: pointer;
      }
      .form-section {
        margin-bottom: 2rem;
      }
      .form-section-title {
        font-size: 1.25rem;
        margin-bottom: 1rem;
        color: var(--primary);
      }
      .input-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-bottom: 1rem;
      }
      @media (max-width: 900px) {
        .config-grid {
          grid-template-columns: 1fr;
        }
        .input-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <div class="sidebar-logo">SGE v2.0</div>
        <nav class="nav-list">
          <div class="nav-item">
            <a href="dashboard.html" class="nav-link">Dashboard</a>
          </div>
          <div class="nav-item">
            <a href="../apenas-html/frequencia.html" class="nav-link">Relatórios</a>
          </div>
          <div class="nav-item">
            <a href="../apenas-html/configuracoes-escola.html" class="nav-link active"
              >Escola</a
            >
          </div>
          <div class="nav-item">
            <a href="../apenas-html/perfil.html" class="nav-link">Meu Perfil</a>
          </div>
        </nav>
      </aside>

      <main class="main-content">
        <header class="content-header">
          <h1 class="content-title">Configurações da Escola</h1>
          <button class="btn" id="btn-save">Salvar Alterações</button>
        </header>

        <form id="form-escola" class="config-grid" role="form">
          <div class="card">
            <div class="form-section">
              <h2 class="form-section-title">Dados Institucionais</h2>
              <div class="input-group">
                <label>Nome da Instituição</label>
                <input
                  type="text"
                  id="escola-nome"
                  class="input-field"
                  required
                />
              </div>
              <div class="input-row">
                <div class="input-group">
                  <label>CNPJ</label>
                  <input
                    type="text"
                    id="escola-cnpj"
                    class="input-field"
                    placeholder="00.000.000/0000-00"
                  />
                </div>
                <div class="input-group">
                  <label>Ano Letivo Ativo</label>
                  <input
                    type="number"
                    id="escola-ano"
                    class="input-field"
                    value="2026"
                  />
                </div>
              </div>
              <div class="input-group">
                <label>Endereço Completo</label>
                <input type="text" id="escola-endereco" class="input-field" />
              </div>
            </div>

            <div class="form-section">
              <h2 class="form-section-title">Configurações de Turno</h2>
              <div class="input-row">
                <div class="input-group">
                  <label>Início Matutino</label>
                  <input
                    type="time"
                    id="turno-mat-inicio"
                    class="input-field"
                  />
                </div>
                <div class="input-group">
                  <label>Fim Matutino</label>
                  <input type="time" id="turno-mat-fim" class="input-field" />
                </div>
              </div>
            </div>
          </div>

          <div class="card">
            <h2 class="form-section-title">Logotipo</h2>
            <div class="logo-preview" id="logo-container">
              <img
                id="img-preview"
                src=""
                alt="Logo da Escola"
                class="hidden"
              />
              <span id="logo-placeholder">Sem Logo</span>
              <label class="logo-overlay">
                Alterar Logo
                <input
                  type="file"
                  id="logo-input"
                  accept="image/*"
                  class="hidden"
                />
              </label>
            </div>
            <p
              style="
                font-size: 0.7rem;
                color: var(--text-tertiary);
                margin-top: 1rem;
              "
            >
              Formatos: PNG, JPG. Máx: 2MB. Recomendado: 512x512px.
            </p>
          </div>
        </form>
      </main>
    </div>
    <script type="module" src="./js/configuracoes-escola.js"></script>
  </body>
</html>
