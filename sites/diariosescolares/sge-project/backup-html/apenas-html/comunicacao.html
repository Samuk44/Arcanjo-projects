<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comunicação - SGE Diretor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1115;
        --surface: #181b21;
        --surface-light: #1f2329;
        --primary: #f0a500;
        --text: #e6e9ed;
        --text-secondary: #a8adb5;
        --border: #2a2e35;
        --info: #4dabf7;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background-color: var(--bg);
        color: var(--text);
      }
      .container {
        display: grid;
        grid-template-columns: 260px 1fr;
        min-height: 100vh;
      }
      .sidebar {
        width: 260px;
        background-color: var(--surface);
        border-right: 1px solid var(--border);
        padding: 1.5rem 1rem;
        position: fixed;
        height: 100vh;
      }
      .sidebar-logo {
        font-family: "Syne", sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 2rem;
      }
      .sidebar-nav-link {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.75rem 1rem;
        color: var(--text-secondary);
        text-decoration: none;
        border-radius: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .sidebar-nav-link.active {
        background-color: var(--surface-light);
        color: var(--primary);
      }
      .main-content {
        margin-left: 260px;
        padding: 1.5rem;
      }
      .content-header {
        margin-bottom: 2rem;
      }
      .content-title {
        font-family: "Syne", sans-serif;
        font-size: 2rem;
        font-weight: 700;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        gap: 2rem;
      }
      .card {
        background: var(--surface);
        padding: 1.5rem;
        border-radius: 0.75rem;
        border: 1px solid var(--border);
      }
      .card-title {
        font-family: "Syne", sans-serif;
        font-size: 1.25rem;
        margin-bottom: 1.5rem;
        color: var(--text);
      }
      .chart-container {
        height: 250px;
        width: 100%;
      }
      .bar {
        fill: var(--primary);
        rx: 4;
      }
      text {
        fill: var(--text-secondary);
        font-size: 10px;
        font-family: "DM Mono";
      }
      .inativo-row {
        border-bottom: 1px solid var(--border);
        padding: 0.75rem 0;
        display: flex;
        justify-content: space-between;
      }
      .inativo-name {
        color: var(--text);
      }
      .inativo-days {
        color: var(--error);
        font-weight: 600;
        font-family: "DM Mono";
      }
    </style>
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <div class="sidebar-logo">SGE v2.0</div>
        <nav>
          <a href="frequencia.html" class="sidebar-nav-link">Frequência</a>
          <a href="notas.html" class="sidebar-nav-link">Notas</a>
          <a href="comunicacao.html" class="sidebar-nav-link active"
            >Comunicação</a
          >
        </nav>
      </aside>
      <main class="main-content">
        <header class="content-header">
          <h1 class="content-title">Engajamento de Pais</h1>
        </header>
        <div class="stats-grid">
          <div class="card">
            <h2 class="card-title">Taxa de Leitura (%)</h2>
            <div id="chart-leitura" class="chart-container"></div>
          </div>
          <div class="card">
            <h2 class="card-title">Pais Inativos (>30 dias)</h2>
            <div
              id="lista-inativos"
              style="max-height: 250px; overflow-y: auto"
            ></div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="../../diretor/js/relatorios-comunicacao.js"></script>
  </body>
</html>
