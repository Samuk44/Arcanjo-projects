<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notas - SGE Diretor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1115;
        --surface: #181b21;
        --surface-light: #1f2329;
        --primary: #f0a500;
        --text: #e6e9ed;
        --text-secondary: #a8adb5;
        --error: #ff6b6b;
        --success: #51cf66;
        --border: #2a2e35;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "DM Sans", sans-serif;
        background-color: var(--bg);
        color: var(--text);
      }
      .container {
        display: grid;
        grid-template-columns: 260px 1fr;
        min-height: 100vh;
      }
      .sidebar {
        width: 260px;
        background-color: var(--surface);
        border-right: 1px solid var(--border);
        padding: 1.5rem 1rem;
        position: fixed;
        height: 100vh;
      }
      .sidebar-logo {
        font-family: "Syne", sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 2rem;
      }
      .sidebar-nav-link {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.75rem 1rem;
        color: var(--text-secondary);
        text-decoration: none;
        border-radius: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .sidebar-nav-link.active {
        background-color: var(--surface-light);
        color: var(--primary);
      }
      .main-content {
        margin-left: 260px;
        padding: 1.5rem;
      }
      .content-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
      }
      .content-title {
        font-family: "Syne", sans-serif;
        font-size: 2rem;
        font-weight: 700;
      }
      .btn {
        padding: 0.5rem 1rem;
        background-color: var(--primary);
        color: var(--bg);
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
        font-weight: 600;
      }
      .filters-container {
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 1.5rem;
        margin-bottom: 2rem;
      }
      .filters-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
      }
      .filter-select {
        padding: 0.5rem 1rem;
        background-color: var(--surface-light);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        width: 100%;
      }
      .history-table {
        width: 100%;
        border-collapse: collapse;
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        overflow: hidden;
      }
      .history-table th {
        padding: 1rem;
        text-align: left;
        color: var(--text-secondary);
        font-size: 0.85rem;
        text-transform: uppercase;
        background-color: var(--surface-light);
      }
      .history-table td {
        padding: 1rem;
        border-bottom: 1px solid var(--border);
      }
      .mono {
        font-family: "DM Mono", monospace;
      }
      .status-badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 0.25rem;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .status-badge.rec {
        background-color: rgba(255, 107, 107, 0.1);
        color: var(--error);
      }
      .status-badge.ok {
        background-color: rgba(81, 207, 102, 0.1);
        color: var(--success);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <div class="sidebar-logo">SGE v2.0</div>
        <nav>
          <a href="frequencia.html" class="sidebar-nav-link">Frequência</a>
          <a href="notas.html" class="sidebar-nav-link active">Notas</a>
          <a href="comunicacao.html" class="sidebar-nav-link">Comunicação</a>
        </nav>
      </aside>
      <main class="main-content">
        <header class="content-header">
          <h1 class="content-title">Relatório de Notas</h1>
          <button class="btn" id="export-csv">Exportar CSV</button>
        </header>
        <section class="filters-container">
          <div class="filters-grid">
            <div class="filter-group">
              <select id="bimestre" class="filter-select">
                <option value="1">1º Bimestre</option>
                <option value="2">2º Bimestre</option>
              </select>
            </div>
            <div class="filter-group">
              <select id="turma" class="filter-select">
                <option value="all">Todas as Turmas</option>
              </select>
            </div>
          </div>
        </section>
        <table class="history-table">
          <thead>
            <tr>
              <th>Aluno</th>
              <th>Turma</th>
              <th>Média</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="lista-notas"></tbody>
        </table>
      </main>
    </div>
    <script type="module" src="../../../diretor/js/relatorios-notas.js"></script>
  </body>
</html>
