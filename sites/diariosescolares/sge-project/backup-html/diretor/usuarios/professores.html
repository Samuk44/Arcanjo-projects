<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Gestão de Professores | SGE Diretor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../public/assets/css/global.css" />
    <link rel="stylesheet" href="../../../public/assets/css/components.css" />
    <link rel="stylesheet" href="../../../public/assets/css/sidebar.css" />
    <style>
      :root {
        --success: #51cf66;
        --danger: #ff6b6b;
        --warning: #ffd93d;
      }
      .main-content {
        margin-left: 260px;
        padding: 2rem;
        max-width: 1400px;
        margin-inline: auto;
      }
      .breadcrumbs {
        font-size: 0.8rem;
        color: var(--text-secondary);
        margin-bottom: 1rem;
      }
      .content-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
      }

      .filters-container {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 1.5rem;
        margin-bottom: 2rem;
      }
      .filters-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 1rem;
      }

      .history-table {
        width: 100%;
        border-collapse: collapse;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        overflow: hidden;
      }
      .history-table th {
        background: var(--surface-light);
        padding: 1rem;
        text-align: left;
        font-size: 0.75rem;
        text-transform: uppercase;
        color: var(--text-secondary);
        position: sticky;
        top: 0;
      }
      .history-table td {
        padding: 1rem;
        border-bottom: 1px solid var(--border);
        font-size: 0.9rem;
      }
      .history-table tr:hover {
        background: rgba(255, 255, 255, 0.02);
      }

      .prof-photo {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        object-fit: cover;
        background: var(--surface-light);
      }
      .badge {
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .badge-ativo {
        background: rgba(81, 207, 102, 0.1);
        color: var(--success);
      }
      .badge-pendente {
        background: rgba(240, 165, 0, 0.1);
        color: var(--primary);
      }
      .badge-desativado {
        background: rgba(255, 107, 107, 0.1);
        color: var(--danger);
      }

      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(8px);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.2s;
      }
      .modal.active {
        display: flex;
      }
      .modal-content {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
        width: 90%;
        max-width: 800px;
        max-height: 90vh;
        overflow-y: auto;
        padding: 2.5rem;
      }

      .tabs {
        display: flex;
        gap: 1.5rem;
        border-bottom: 1px solid var(--border);
        margin-bottom: 1.5rem;
      }
      .tab-btn {
        padding: 0.75rem 0;
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        font-weight: 600;
        border-bottom: 2px solid transparent;
      }
      .tab-btn.active {
        color: var(--primary);
        border-bottom-color: var(--primary);
      }
      .tab-pane {
        display: none;
      }
      .tab-pane.active {
        display: block;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (max-width: 768px) {
        .main-content {
          margin-left: 0;
          padding: 1rem;
        }
        .history-table,
        thead,
        tbody,
        th,
        td,
        tr {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <div class="sidebar-logo">SGE v2.0</div>
        <nav class="nav-list">
          <div class="nav-item">
            <a href="../dashboard.html" class="nav-link">Dashboard</a>
          </div>
          <div class="nav-item">
            <a href="professores.html" class="nav-link active">Professores</a>
          </div>
        </nav>
      </aside>

      <main class="main-content">
        <nav class="breadcrumbs">Diretor > Usuários > Professores</nav>
        <header class="content-header">
          <h1 class="content-title">Gestão de Professores</h1>
          <div class="action-buttons">
            <button class="btn btn-secondary" id="btn-export">
              Exportar CSV
            </button>
            <a href="/cadastro/professor.html?mode=manual" class="btn"
              >+ Cadastrar Professor</a
            >
          </div>
        </header>

        <section class="filters-container">
          <div class="filters-grid">
            <div class="input-group">
              <label>Busca</label>
              <input
                type="text"
                id="filter-search"
                class="input-field"
                placeholder="Nome ou e-mail..."
              />
            </div>
            <div class="input-group">
              <label>Disciplina</label>
              <select id="filter-disciplina" class="input-field">
                <option value="all">Todas</option>
              </select>
            </div>
            <div class="input-group">
              <label>Status</label>
              <select id="filter-status" class="input-field">
                <option value="all">Todos</option>
                <option value="ativo">Ativo</option>
                <option value="pendente">Pendente</option>
                <option value="desativado">Desativado</option>
              </select>
            </div>
          </div>
        </section>

        <div style="overflow-x: auto">
          <table class="history-table" role="table">
            <thead>
              <tr>
                <th><input type="checkbox" id="select-all" /></th>
                <th>Foto</th>
                <th>Nome</th>
                <th>Email</th>
                <th>Disciplinas</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>

        <div
          class="pagination"
          style="
            margin-top: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <span
            id="pagination-info"
            class="mono"
            style="font-size: 0.8rem"
          ></span>
          <div style="display: flex; gap: 0.5rem">
            <button class="btn btn-secondary btn-sm" id="btn-prev">
              Anterior
            </button>
            <button class="btn btn-secondary btn-sm" id="btn-next">
              Próxima
            </button>
          </div>
        </div>
      </main>
    </div>

    <div id="modal-detalhes" class="modal">
      <div class="modal-content">
        <div class="tabs">
          <button class="tab-btn active" data-tab="info-geral">
            Dados Gerais
          </button>
          <button class="tab-btn" data-tab="info-turmas">
            Turmas Vinculadas
          </button>
          <button class="tab-btn" data-tab="info-historico">Histórico</button>
        </div>
        <div id="info-geral" class="tab-pane active"></div>
        <div id="info-turmas" class="tab-pane"></div>
        <div id="info-historico" class="tab-pane"></div>
        <div style="margin-top: 2rem; display: flex; justify-content: flex-end">
          <button class="btn btn-secondary" id="close-modal">Fechar</button>
        </div>
      </div>
    </div>

    <script type="module" src="../../../diretor/js/usuarios-professores.js"></script>
  </body>
</html>
