<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <meta name="theme-color" content="#0f1115" />
    <title>SGE v2.0 - Controle de Chamada</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&family=Syne:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1115;
        --surface: #181b21;
        --surface-alt: #1f2329;
        --primary: #f0a500;
        --primary-hover: #e09500;
        --text: #e6e9ed;
        --text-secondary: #a8adb5;
        --text-tertiary: #7a8089;
        --border: #2d3139;
        --success: #22c55e;
        --danger: #f43f5e;
        --warning: #facc15;
        --info: #3b82f6;
        --radius: 0.5rem;
        --transition: 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          "DM Sans",
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }

      .container {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 100vh;
      }

      .sidebar {
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 2.5rem;
        font-weight: 700;
        color: var(--primary);
        font-size: 1.25rem;
      }

      .sidebar-logo {
        width: 32px;
        height: 32px;
        background: var(--primary);
        border-radius: var(--radius);
        display: grid;
        place-items: center;
        color: var(--bg);
        font-weight: 900;
      }

      .sidebar-nav {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .sidebar-nav a {
        padding: 0.75rem 1rem;
        border-radius: var(--radius);
        text-decoration: none;
        color: var(--text-secondary);
        transition: all var(--transition);
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.95rem;
      }

      .sidebar-nav a:hover,
      .sidebar-nav a.active {
        background: var(--surface-alt);
        color: var(--primary);
      }

      .main-content {
        padding: 2rem;
        overflow-y: auto;
      }

      .header {
        margin-bottom: 2rem;
      }

      .header h1 {
        font-family: "Syne", sans-serif;
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .header p {
        color: var(--text-secondary);
        font-size: 0.95rem;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        backdrop-filter: blur(8px);
      }

      .selectors {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }

      .selector-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .selector-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--text-tertiary);
        letter-spacing: 0.05em;
      }

      select,
      input[type="search"] {
        background: var(--surface-alt);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.75rem 1rem;
        border-radius: var(--radius);
        font-family: inherit;
        font-size: 0.95rem;
        transition: all var(--transition);
      }

      select:focus,
      input[type="search"]:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(240, 165, 0, 0.1);
      }

      .status-bar {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.5rem;
        padding: 1rem;
        background: var(--surface-alt);
        border-radius: var(--radius);
      }

      .status-info {
        flex: 1;
      }

      .status-label {
        font-size: 0.75rem;
        color: var(--text-tertiary);
        text-transform: uppercase;
        font-weight: 700;
        margin-bottom: 0.25rem;
      }

      .status-value {
        font-family: "DM Mono", monospace;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--primary);
      }

      .progress-bar {
        flex: 2;
        height: 8px;
        background: var(--border);
        border-radius: 4px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--success), var(--primary));
        transition: width 0.6s var(--transition);
        width: 0%;
      }

      .search-box {
        margin-bottom: 1.5rem;
      }

      .students-list {
        display: grid;
        gap: 0.75rem;
      }

      .student-row {
        display: grid;
        grid-template-columns: 1fr 80px;
        gap: 1rem;
        align-items: center;
        padding: 1rem;
        background: var(--surface-alt);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        transition: all var(--transition);
      }

      .student-row:hover {
        border-color: var(--primary);
        background: rgba(240, 165, 0, 0.05);
      }

      .student-info {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .student-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--info));
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 0.85rem;
        color: white;
      }

      .student-details {
        flex: 1;
      }

      .student-name {
        font-weight: 600;
        color: var(--text);
        font-family: "Syne", sans-serif;
      }

      .student-id {
        font-family: "DM Mono", monospace;
        font-size: 0.75rem;
        color: var(--text-tertiary);
      }

      .attendance-buttons {
        display: flex;
        gap: 0.5rem;
      }

      .btn-attendance {
        width: 28px;
        height: 28px;
        border: 2px solid var(--border);
        background: transparent;
        color: var(--text-secondary);
        border-radius: 4px;
        cursor: pointer;
        font-weight: 700;
        font-size: 0.75rem;
        transition: all var(--transition);
        display: grid;
        place-items: center;
      }

      .btn-attendance:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      .btn-attendance.active {
        border-color: var(--primary);
        color: white;
      }

      .btn-attendance.p.active {
        background: var(--success);
        border-color: var(--success);
      }

      .btn-attendance.f.active {
        background: var(--warning);
        border-color: var(--warning);
      }

      .btn-attendance.j.active {
        background: var(--danger);
        border-color: var(--danger);
      }

      .actions {
        display: flex;
        gap: 1rem;
        margin-top: 1.5rem;
        justify-content: flex-end;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        border-radius: var(--radius);
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--transition);
        border: 1px solid transparent;
        font-family: inherit;
      }

      .btn-primary {
        background: var(--primary);
        color: var(--bg);
      }

      .btn-primary:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
      }

      .btn-primary:disabled {
        background: var(--text-tertiary);
        cursor: not-allowed;
        transform: none;
      }

      .btn-secondary {
        background: var(--surface-alt);
        color: var(--text);
        border-color: var(--border);
      }

      .btn-secondary:hover {
        background: #2d3139;
        border-color: var(--primary);
      }

      #toast-container {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .toast {
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 4px solid var(--primary);
        padding: 1rem 1.5rem;
        border-radius: var(--radius);
        color: var(--text);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        min-width: 320px;
        display: flex;
        align-items: center;
        gap: 1rem;
        animation: toastIn 0.4s var(--transition);
      }

      @keyframes toastIn {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      .toast.success {
        border-left-color: var(--success);
      }
      .toast.error {
        border-left-color: var(--danger);
      }
      .toast.warning {
        border-left-color: var(--warning);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
        }
        .sidebar {
          display: none;
        }
        .selectors {
          grid-template-columns: 1fr;
        }
        .student-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">S</div>
          <span>SGE v2.0</span>
        </div>
        <nav class="sidebar-nav">
          <a href="#"><span>📊</span> Dashboard</a>
          <a href="#" class="active"><span>📋</span> Chamada</a>
          <a href="#"><span>📝</span> Notas</a>
          <a href="#"><span>💬</span> Bilhetes</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="header">
          <h1>Controle de Chamada</h1>
          <p>Registre a presença dos alunos</p>
        </header>

        <section class="card">
          <div class="selectors">
            <div class="selector-group">
              <label class="selector-label">Turma</label>
              <select id="select-turma" aria-label="Selecione a turma">
                <option value="">Carregando turmas...</option>
              </select>
            </div>
            <div class="selector-group">
              <label class="selector-label">Aula</label>
              <select id="select-aula" aria-label="Selecione a aula">
                <option value="">Selecione uma turma primeiro</option>
              </select>
            </div>
          </div>

          <div class="status-bar">
            <div class="status-info">
              <div class="status-label">Status da Aula</div>
              <div class="status-value" id="status-aula">—</div>
            </div>
            <div style="flex: 1">
              <div class="status-label">Progresso</div>
              <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
              </div>
            </div>
          </div>

          <div class="search-box">
            <input
              type="search"
              id="search-alunos"
              placeholder="Buscar aluno por nome..."
              aria-label="Buscar aluno"
            />
          </div>

          <div
            class="students-list"
            id="lista-alunos"
            role="group"
            aria-label="Lista de alunos"
          >
            <div
              style="
                text-align: center;
                padding: 2rem;
                color: var(--text-tertiary);
              "
            >
              Selecione uma turma e aula para visualizar os alunos.
            </div>
          </div>

          <div class="actions">
            <button class="btn btn-secondary" id="btn-limpar">Limpar</button>
            <button class="btn btn-primary" id="btn-salvar" disabled>
              Salvar Chamada
            </button>
          </div>
        </section>
      </main>
    </div>

    <div id="toast-container"></div>

    <script type="module" src="../../../professor/js/chamada.js"></script>
  </body>
</html>
