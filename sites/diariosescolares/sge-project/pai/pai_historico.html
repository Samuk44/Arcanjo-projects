<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Histórico completo de notificações e comunicações"
    />
    <title>Histórico - SGE Responsáveis</title>

    <!-- Fonts -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
      as="style"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- CSS Global -->
    <link rel="stylesheet" href="../assets/css/global.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/sidebar.css" />
    <link rel="stylesheet" href="../assets/css/forms.css" />

    <style>
      :root {
        --bg: #0f1115;
        --surface: #181b21;
        --surface-light: #1f2329;
        --primary: #f0a500;
        --primary-dark: #d48800;
        --text: #e6e9ed;
        --text-secondary: #a8adb5;
        --text-tertiary: #7a7f87;
        --error: #ff6b6b;
        --success: #51cf66;
        --warning: #ffd93d;
        --info: #4dabf7;
        --border: #2a2e35;
        --shadow: rgba(0, 0, 0, 0.3);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background-color: var(--bg);
        color: var(--text);
        line-height: 1.6;
        overflow-x: hidden;
      }

      .container {
        display: grid;
        grid-template-columns: auto 1fr;
        min-height: 100vh;
      }

      /* Sidebar */
      .sidebar {
        width: 260px;
        background-color: var(--surface);
        border-right: 1px solid var(--border);
        padding: 1.5rem 1rem;
        position: fixed;
        left: 0;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        transition: transform 0.3s ease;
        z-index: 1000;
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 2rem;
      }

      .sidebar-logo {
        font-family: "Syne", sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--primary);
      }

      .sidebar-toggle {
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 1.25rem;
        padding: 0.5rem;
        transition: color 0.2s;
      }

      .sidebar-toggle:hover {
        color: var(--primary);
      }

      .sidebar-nav {
        list-style: none;
      }

      .sidebar-nav-item {
        margin-bottom: 0.5rem;
      }

      .sidebar-nav-link {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.75rem 1rem;
        color: var(--text-secondary);
        text-decoration: none;
        border-radius: 0.5rem;
        transition: all 0.2s;
        font-size: 0.95rem;
      }

      .sidebar-nav-link:hover,
      .sidebar-nav-link.active {
        background-color: var(--surface-light);
        color: var(--primary);
      }

      .sidebar-nav-icon {
        font-size: 1.25rem;
        min-width: 1.5rem;
        text-align: center;
      }

      /* Main Content */
      .main-content {
        margin-left: 260px;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        background-color: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 1rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .topbar-greeting {
        font-family: "Syne", sans-serif;
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text);
      }

      /* Content Area */
      .content {
        flex: 1;
        padding: 1.5rem;
        overflow-y: auto;
      }

      .content-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 2rem;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .content-title {
        font-family: "Syne", sans-serif;
        font-size: 2rem;
        font-weight: 700;
        color: var(--text);
      }

      .action-buttons {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }

      .btn {
        padding: 0.5rem 1rem;
        background-color: var(--primary);
        color: var(--bg);
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
        font-size: 0.9rem;
      }

      .btn:hover {
        background-color: var(--primary-dark);
        transform: translateY(-2px);
      }

      .btn-secondary {
        background-color: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
      }

      .btn-secondary:hover {
        background-color: var(--surface-light);
        border-color: var(--primary);
      }

      /* Filters */
      .filters-container {
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 1.5rem;
        margin-bottom: 2rem;
      }

      .filters-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
      }

      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .filter-label {
        color: var(--text-secondary);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
      }

      .filter-input,
      .filter-select {
        padding: 0.5rem 1rem;
        background-color: var(--surface-light);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        font-family: "DM Sans", sans-serif;
        font-size: 0.95rem;
        transition: border-color 0.2s;
      }

      .filter-input:focus,
      .filter-select:focus {
        outline: none;
        border-color: var(--primary);
      }

      .filter-actions {
        display: flex;
        gap: 0.5rem;
        align-items: flex-end;
      }

      /* History Table */
      .history-table {
        width: 100%;
        border-collapse: collapse;
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        overflow: hidden;
      }

      .history-table thead {
        background-color: var(--surface-light);
        border-bottom: 1px solid var(--border);
      }

      .history-table th {
        padding: 1rem;
        text-align: left;
        color: var(--text-secondary);
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .history-table td {
        padding: 1rem;
        border-bottom: 1px solid var(--border);
        color: var(--text);
        font-size: 0.95rem;
      }

      .history-table tbody tr:hover {
        background-color: var(--surface-light);
        cursor: pointer;
      }

      .history-table tbody tr:last-child td {
        border-bottom: none;
      }

      .type-badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        background-color: var(--surface-light);
        color: var(--primary);
        border-radius: 0.25rem;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .type-badge.falta {
        background-color: rgba(255, 107, 107, 0.1);
        color: var(--error);
      }

      .type-badge.bilhete {
        background-color: rgba(77, 171, 247, 0.1);
        color: var(--info);
      }

      .type-badge.aviso {
        background-color: rgba(255, 217, 61, 0.1);
        color: var(--warning);
      }

      .type-badge.nota {
        background-color: rgba(81, 207, 102, 0.1);
        color: var(--success);
      }

      .status-badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        background-color: rgba(81, 207, 102, 0.1);
        color: var(--success);
        border-radius: 0.25rem;
        font-size: 0.75rem;
        font-weight: 600;
      }

      .status-badge.unread {
        background-color: rgba(240, 165, 0, 0.1);
        color: var(--primary);
      }

      /* Pagination */
      .pagination {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 2rem;
        flex-wrap: wrap;
      }

      .pagination-btn {
        padding: 0.5rem 1rem;
        background-color: var(--surface);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.9rem;
      }

      .pagination-btn:hover:not(:disabled) {
        background-color: var(--surface-light);
        border-color: var(--primary);
      }

      .pagination-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .pagination-btn.active {
        background-color: var(--primary);
        color: var(--bg);
        border-color: var(--primary);
      }

      .pagination-info {
        color: var(--text-secondary);
        font-size: 0.9rem;
      }

      /* Empty State */
      .empty-state {
        text-align: center;
        padding: 3rem 1.5rem;
        color: var(--text-secondary);
      }

      .empty-state-icon {
        font-size: 3rem;
        margin-bottom: 1rem;
        opacity: 0.5;
      }

      .empty-state-title {
        font-family: "Syne", sans-serif;
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: var(--text);
      }

      /* Modal */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(8px);
        z-index: 2000;
        align-items: center;
        justify-content: center;
      }

      .modal.active {
        display: flex;
      }

      .modal-content {
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        padding: 2rem;
        max-width: 500px;
        width: 90%;
        max-height: 90vh;
        overflow-y: auto;
        animation: slideIn 0.3s ease;
      }

      @keyframes slideIn {
        from {
          transform: translateY(-50px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
        border-bottom: 1px solid var(--border);
        padding-bottom: 1rem;
      }

      .modal-title {
        font-family: "Syne", sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text);
      }

      .modal-close {
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        font-size: 1.5rem;
        padding: 0;
        transition: color 0.2s;
      }

      .modal-close:hover {
        color: var(--primary);
      }

      .modal-body {
        margin-bottom: 1.5rem;
      }

      .modal-footer {
        display: flex;
        gap: 1rem;
        justify-content: flex-end;
      }

      /* Toast */
      .toast-container {
        position: fixed;
        top: 1.5rem;
        right: 1.5rem;
        z-index: 3000;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        max-width: 400px;
      }

      .toast {
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: 1rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 1rem;
        animation: slideInRight 0.3s ease;
        box-shadow: 0 8px 24px var(--shadow);
      }

      @keyframes slideInRight {
        from {
          transform: translateX(400px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      .toast-icon {
        font-size: 1.25rem;
        flex-shrink: 0;
      }

      .toast-success .toast-icon {
        color: var(--success);
      }

      .toast-error .toast-icon {
        color: var(--error);
      }

      .toast-message {
        flex: 1;
        font-size: 0.95rem;
        color: var(--text);
      }

      /* Responsive */
      @media (max-width: 1024px) {
        .filters-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
        }

        .sidebar {
          width: 100%;
          height: auto;
          position: relative;
          border-right: none;
          border-bottom: 1px solid var(--border);
          padding: 1rem;
        }

        .main-content {
          margin-left: 0;
        }

        .content {
          padding: 1rem;
        }

        .content-title {
          font-size: 1.5rem;
        }

        .filters-grid {
          grid-template-columns: 1fr;
        }

        .history-table {
          font-size: 0.85rem;
        }

        .history-table th,
        .history-table td {
          padding: 0.75rem;
        }
      }

      @media (max-width: 480px) {
        .content-header {
          flex-direction: column;
          align-items: flex-start;
        }

        .action-buttons {
          width: 100%;
        }

        .action-buttons .btn {
          flex: 1;
        }

        .modal-content {
          width: 95%;
          padding: 1.5rem;
        }

        .history-table {
          display: block;
          overflow-x: auto;
        }
      }

      /* Accessibility */
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">SGE</div>
          <button
            class="sidebar-toggle"
            id="sidebarToggle"
            aria-label="Toggle sidebar"
          >
            ☰
          </button>
        </div>
        <nav>
          <ul class="sidebar-nav">
            <li class="sidebar-nav-item">
              <a href="pai_index.html" class="sidebar-nav-link" data-page="feed">
                <span class="sidebar-nav-icon">📬</span>
                <span>Feed</span>
              </a>
            </li>
            <li class="sidebar-nav-item">
              <a
                href="pai_historico.html"
                class="sidebar-nav-link active"
                data-page="historico"
              >
                <span class="sidebar-nav-icon">📋</span>
                <span>Histórico</span>
              </a>
            </li>
            <li class="sidebar-nav-item">
              <a
                href="pai_perfil_aluno.html"
                class="sidebar-nav-link"
                data-page="perfil-aluno"
              >
                <span class="sidebar-nav-icon">👤</span>
                <span>Perfil do Aluno</span>
              </a>
            </li>
            <li class="sidebar-nav-item">
              <a href="perfil.html" class="sidebar-nav-link" data-page="perfil">
                <span class="sidebar-nav-icon">⚙️</span>
                <span>Configurações</span>
              </a>
            </li>
          </ul>
        </nav>
      </aside>

      <!-- Main Content -->
      <div class="main-content">
        <!-- Topbar -->
        <header class="topbar">
          <div class="topbar-greeting" id="greeting">
            Histórico de Notificações
          </div>
        </header>

        <!-- Content -->
        <main class="content">
          <div class="content-header">
            <h1 class="content-title">Histórico Completo</h1>
            <div class="action-buttons">
              <button class="btn btn-secondary" id="clearFiltersBtn">
                Limpar filtros
              </button>
              <button class="btn" id="exportBtn">📥 Exportar CSV</button>
            </div>
          </div>

          <!-- Filters -->
          <div class="filters-container">
            <div class="filters-grid">
              <div class="filter-group">
                <label for="typeFilter" class="filter-label">Tipo</label>
                <select id="typeFilter" class="filter-select">
                  <option value="">Todos os tipos</option>
                  <option value="falta">Faltas</option>
                  <option value="bilhete">Bilhetes</option>
                  <option value="nota">Notas</option>
                  <option value="aviso">Avisos</option>
                </select>
              </div>

              <div class="filter-group">
                <label for="statusFilter" class="filter-label">Status</label>
                <select id="statusFilter" class="filter-select">
                  <option value="">Todos os status</option>
                  <option value="lido">Lido</option>
                  <option value="nao-lido">Não lido</option>
                </select>
              </div>

              <div class="filter-group">
                <label for="childFilter" class="filter-label">Aluno</label>
                <select id="childFilter" class="filter-select">
                  <option value="">Todos os alunos</option>
                </select>
              </div>

              <div class="filter-group">
                <label for="dateFrom" class="filter-label">De</label>
                <input type="text" placeholder="DD/MM/AAAA" maxlength="10" autocomplete="off" id="dateFrom" class="filter-input" />
              </div>

              <div class="filter-group">
                <label for="dateTo" class="filter-label">Até</label>
                <input type="text" placeholder="DD/MM/AAAA" maxlength="10" autocomplete="off" id="dateTo" class="filter-input" />
              </div>

              <div class="filter-group">
                <label for="searchInput" class="filter-label">Buscar</label>
                <input
                  type="text"
                  id="searchInput"
                  class="filter-input"
                  placeholder="Assunto ou professor..."
                />
              </div>
            </div>
          </div>

          <!-- History Table -->
          <div style="overflow-x: auto">
            <table class="history-table" id="historyTable">
              <thead>
                <tr>
                  <th>Tipo</th>
                  <th>Título</th>
                  <th>Remetente</th>
                  <th>Data</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="historyTableBody">
                <tr>
                  <td colspan="5" style="text-align: center; padding: 2rem">
                    Carregando...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Empty State -->
          <div class="empty-state" id="emptyState" style="display: none">
            <div class="empty-state-icon">📭</div>
            <div class="empty-state-title">Nenhum registro encontrado</div>
          </div>

          <!-- Pagination -->
          <div class="pagination" id="pagination"></div>
        </main>
      </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="detailModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="modalTitle">Detalhes</h2>
          <button class="modal-close" id="modalClose">✕</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer" id="modalFooter"></div>
      </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Firebase Scripts -->
    <script type="module" src="js/pai_historico.js"></script>
  </body>
</html>
