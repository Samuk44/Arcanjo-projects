<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Perfil - SGE v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              bg: "#0f172a",
              surface: "#1e293b",
              border: "#334155",
              primary: "#3b82f6",
              primaryHover: "#2563eb",
              accentFrom: "#60a5fa",
              accentTo: "#3b82f6",
              text: "#f8fafc",
              muted: "#94a3b8",
              success: "#22c55e",
              warning: "#f59e0b",
              danger: "#ef4444",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Syne", "sans-serif"],
            },
            boxShadow: {
              soft: "0 24px 60px rgba(59, 130, 246, 0.12)",
              card: "0 1px 4px 0 rgba(2, 6, 23, 0.4)",
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: Inter, sans-serif;
        background: #0f172a;
      }
      .shadow-soft {
        box-shadow: 0 24px 60px rgba(59, 130, 246, 0.12);
      }
      .hover-surface:hover {
        background-color: #334155;
      }
      .transition-fast {
        transition: all 0.15s ease-in-out;
      }
      .input-field {
        background: #0f172a;
        border: 1px solid #334155;
        color: #f8fafc;
        border-radius: 12px;
        padding: 12px 16px;
        width: 100%;
      }
      .input-field:focus {
        outline: none;
        border-color: #60a5fa;
        box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.2);
      }
      .skeleton {
        background: linear-gradient(
          90deg,
          #1e293b 25%,
          #334155 50%,
          #1e293b 75%
        );
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
      }
      @keyframes loading {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
    </style>
  </head>
  <body class="min-h-screen text-text">
    <div class="min-h-screen flex bg-[#0f172a]">
      <aside
        id="sidebar"
        class="hidden md:flex w-72 flex-col bg-[#1e293b] border-r border-[#334155]"
      >
        <div class="p-6 border-b border-[#334155]">
          <h1
            class="font-display text-2xl text-[#60a5fa] font-bold tracking-tight"
          >
            SGE v2.0
          </h1>
          <p class="text-xs text-muted mt-1">Painel do Responsável</p>
        </div>
        <nav class="flex-1 overflow-y-auto py-4">
          <ul class="space-y-1 px-4">
            <li>
              <a
                href="index.html"
                class="block rounded-2xl px-4 py-3 text-sm font-medium text-muted hover:bg-blue-600/10 hover:text-white transition-fast"
                >Dashboard</a
              >
            </li>
            <li
              class="pt-6 pb-2 text-xs font-semibold uppercase tracking-wider text-muted"
            >
              Acadêmico
            </li>
            <li>
              <a
                href="boletim.html"
                class="block rounded-2xl px-4 py-3 text-sm font-medium text-muted hover:bg-blue-600/10 hover:text-white transition-fast"
                >Boletim</a
              >
            </li>
            <li>
              <a
                href="horario.html"
                class="block rounded-2xl px-4 py-3 text-sm font-medium text-muted hover:bg-blue-600/10 hover:text-white transition-fast"
                >Horário</a
              >
            </li>
            <li
              class="pt-6 pb-2 text-xs font-semibold uppercase tracking-wider text-muted"
            >
              Comunicação
            </li>
            <li>
              <a
                href="comunicados.html"
                class="block rounded-2xl px-4 py-3 text-sm font-medium text-muted hover:bg-blue-600/10 hover:text-white transition-fast"
                >Comunicados</a
              >
            </li>
            <li
              class="pt-6 pb-2 text-xs font-semibold uppercase tracking-wider text-muted"
            >
              Financeiro
            </li>
            <li>
              <a
                href="financeiro.html"
                class="block rounded-2xl px-4 py-3 text-sm font-medium text-muted hover:bg-blue-600/10 hover:text-white transition-fast"
                >Boletos</a
              >
            </li>
            <li
              class="pt-6 pb-2 text-xs font-semibold uppercase tracking-wider text-muted"
            >
              Sistema
            </li>
            <li>
              <a
                href="perfil.html"
                class="block rounded-2xl px-4 py-3 text-sm font-medium text-white bg-blue-600/20 border border-blue-500/30"
                >Meu Perfil</a
              >
            </li>
          </ul>
        </nav>
        <div class="p-6 border-t border-[#334155]">
          <button
            id="sidebarLogout"
            class="w-full inline-flex items-center justify-center gap-2 rounded-2xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm font-semibold text-red-400 transition-fast hover:bg-red-500/20"
            type="button"
          >
            Sair
          </button>
        </div>
      </aside>
      <div class="flex-1 flex flex-col">
        <header
          class="sticky top-0 z-20 bg-[#1e293b] border-b border-[#334155] px-5 py-4"
        >
          <div class="flex items-center justify-between gap-4">
            <div>
              <p class="text-sm text-muted">
                Olá, <span id="userGreeting">Carregando...</span>
              </p>
              <h1 class="text-2xl font-display font-semibold text-text">
                Meu Perfil
              </h1>
            </div>
            <div class="flex items-center gap-3">
              <button
                id="logoutButton"
                class="hidden sm:inline-flex items-center gap-2 rounded-2xl bg-blue-600/20 px-4 py-2 text-sm font-semibold text-blue-400 transition-fast hover:bg-blue-600/30"
                type="button"
              >
                Sair
              </button>
              <div
                class="w-11 h-11 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 text-white flex items-center justify-center text-lg font-semibold"
                id="userAvatar"
              >
                R
              </div>
            </div>
          </div>
        </header>
        <main class="flex-1 overflow-y-auto p-5 md:p-8">
          <div class="max-w-2xl mx-auto">
            <section
              class="bg-[#1e293b] rounded-[32px] border border-[#334155] shadow-soft p-6 mb-6"
            >
              <h3 class="text-lg font-semibold text-text mb-4">
                Informações Pessoais
              </h3>
              <form id="profile-form" class="space-y-4">
                <div>
                  <label class="block text-sm text-muted mb-1"
                    >Nome Completo</label
                  ><input type="text" id="nome" class="input-field" required />
                </div>
                <div>
                  <label class="block text-sm text-muted mb-1">E-mail</label
                  ><input
                    type="email"
                    id="email"
                    class="input-field"
                    required
                  />
                </div>
                <div>
                  <label class="block text-sm text-muted mb-1">Telefone</label
                  ><input
                    type="tel"
                    id="telefone"
                    class="input-field"
                    placeholder="(00) 00000-0000"
                  />
                </div>
                <button
                  type="submit"
                  class="w-full md:w-auto rounded-2xl bg-gradient-to-r from-blue-500 to-blue-600 px-6 py-3 text-sm font-semibold text-white shadow-soft transition-fast hover:from-blue-600 hover:to-blue-700"
                >
                  Salvar Alterações
                </button>
              </form>
            </section>
            <section
              class="bg-[#1e293b] rounded-[32px] border border-[#334155] shadow-soft p-6"
            >
              <h3 class="text-lg font-semibold text-text mb-4">
                Alterar Senha
              </h3>
              <form id="password-form" class="space-y-4">
                <div>
                  <label class="block text-sm text-muted mb-1"
                    >Senha Atual</label
                  ><input
                    type="password"
                    id="senha-atual"
                    class="input-field"
                    required
                  />
                </div>
                <div>
                  <label class="block text-sm text-muted mb-1">Nova Senha</label
                  ><input
                    type="password"
                    id="nova-senha"
                    class="input-field"
                    required
                  />
                </div>
                <div>
                  <label class="block text-sm text-muted mb-1"
                    >Confirmar Nova Senha</label
                  ><input
                    type="password"
                    id="confirmar-senha"
                    class="input-field"
                    required
                  />
                </div>
                <button
                  type="submit"
                  class="w-full md:w-auto rounded-2xl bg-gradient-to-r from-blue-500 to-blue-600 px-6 py-3 text-sm font-semibold text-white shadow-soft transition-fast hover:from-blue-600 hover:to-blue-700"
                >
                  Atualizar Senha
                </button>
              </form>
            </section>
          </div>
        </main>
      </div>
    </div>
    <div
      id="toast-container"
      class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <script type="module" src="./js/perfil.js"></script>
  </body>
</html>
