<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex" />
    <title>Diários Escolares - Notas</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&family=Syne:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface-alt: #f1f5f9;
        --primary: #3b82f6;
        --primary-hover: #e09500;
        --text: #0f172a;
        --text-secondary: #64748b;
        --text-tertiary: #7a8089;
        --border: #e2e8f0;
        --success: #22c55e;
        --danger: #f43f5e;
        --warning: #facc15;
        --info: #3b82f6;
        --radius: 0.5rem;
        --transition: 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          "DM Sans",
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }

      .container {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 100vh;
      }

      .sidebar {
        background: var(--surface);
        border-right: 1px solid var(--border);
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 2.5rem;
        font-weight: 700;
        color: var(--primary);
        font-size: 1.25rem;
      }

      .sidebar-logo {
        width: 32px;
        height: 32px;
        background: var(--primary);
        border-radius: var(--radius);
        display: grid;
        place-items: center;
        color: var(--bg);
        font-weight: 900;
      }

      .sidebar-nav {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .sidebar-nav a {
        padding: 0.75rem 1rem;
        border-radius: var(--radius);
        text-decoration: none;
        color: var(--text-secondary);
        transition: all var(--transition);
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.95rem;
      }

      .sidebar-nav a:hover,
      .sidebar-nav a.active {
        background: var(--surface-alt);
        color: var(--primary);
      }

      .main-content {
        padding: 2rem;
        overflow-y: auto;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 2rem;
      }

      .header h1 {
        font-family: "Syne", sans-serif;
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .header p {
        color: var(--text-secondary);
        font-size: 0.95rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        border-radius: var(--radius);
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--transition);
        border: 1px solid transparent;
        font-family: inherit;
      }

      .btn-primary {
        background: var(--primary);
        color: var(--bg);
      }

      .btn-primary:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
      }

      .selectors {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
      }

      select {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.75rem 1rem;
        border-radius: var(--radius);
        font-family: inherit;
        font-size: 0.9rem;
        transition: all var(--transition);
      }

      select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }

      .table-wrapper {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow-x: auto;
        margin-bottom: 2rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      th {
        background: var(--surface-alt);
        padding: 1rem;
        text-align: left;
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        border-bottom: 1px solid var(--border);
      }

      td {
        padding: 1rem;
        border-bottom: 1px solid var(--border);
      }

      tr:hover {
        background: rgba(59, 130, 246, 0.02);
      }

      .aluno-nome {
        font-weight: 600;
        color: var(--text);
      }

      input[type="number"] {
        width: 80px;
        background: var(--surface-alt);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.6rem;
        border-radius: 4px;
        font-family: "DM Mono", monospace;
        font-size: 0.9rem;
        font-weight: 600;
        text-align: center;
        transition: all var(--transition);
      }

      input[type="number"]:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }

      input[type="number"]:invalid {
        border-color: var(--danger);
      }

      .status-indicator {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--text-tertiary);
      }

      .status-indicator.ok {
        background: var(--success);
      }
      .status-indicator.warning {
        background: var(--warning);
      }
      .status-indicator.error {
        background: var(--danger);
      }

      textarea {
        width: 100%;
        background: var(--surface-alt);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.75rem;
        border-radius: var(--radius);
        font-family: inherit;
        font-size: 0.9rem;
        resize: vertical;
        min-height: 60px;
      }

      textarea:focus {
        outline: none;
        border-color: var(--primary);
      }

      .rodape-tabela {
        background: var(--surface-alt);
        padding: 1.5rem;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 600;
      }

      .media-turma {
        font-family: "DM Mono", monospace;
        font-size: 1.25rem;
        color: var(--primary);
      }

      .btn-salvar {
        padding: 0.75rem 2rem;
        background: var(--success);
        color: white;
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
        font-weight: 600;
        transition: all var(--transition);
      }

      .btn-salvar:hover {
        background: #16a34a;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(12px);
        display: none;
        place-items: center;
        z-index: 1000;
        padding: 1.5rem;
      }

      .modal-overlay.active {
        display: grid;
      }

      .modal {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 1rem;
        width: 100%;
        max-width: 500px;
        animation: modalIn var(--transition);
      }

      @keyframes modalIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .modal-header {
        padding: 1.5rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .modal-body {
        padding: 2rem;
      }

      .modal-footer {
        padding: 1.5rem;
        background: var(--surface-alt);
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: flex-end;
        gap: 1rem;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      .form-label {
        display: block;
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--text-tertiary);
        margin-bottom: 0.5rem;
        letter-spacing: 0.05em;
      }

      input[type="text"],
      input[type="number"] {
        width: 100%;
        background: var(--surface-alt);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.75rem 1rem;
        border-radius: var(--radius);
        font-family: inherit;
        font-size: 0.95rem;
      }

      #toast-container {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .toast {
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 4px solid var(--primary);
        padding: 1rem 1.5rem;
        border-radius: var(--radius);
        color: var(--text);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        min-width: 320px;
        display: flex;
        align-items: center;
        gap: 1rem;
        animation: toastIn 0.4s var(--transition);
      }

      @keyframes toastIn {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
        }
        .sidebar {
          display: none;
        }
        .header {
          flex-direction: column;
          gap: 1rem;
        }
        .selectors {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <img src="../assets/img/logo.png" alt="Diários Escolares" class="h-10 w-auto object-contain" />
        </div>
        <nav class="sidebar-nav">
          <a href="#"><span>📊</span> Dashboard</a>
          <a href="#"><span>📋</span> Chamada</a>
          <a href="#"><span>👥</span> Alunos</a>
          <a href="#" class="active"><span>📝</span> Notas</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="header">
          <div>
            <h1>Lançamento de Notas</h1>
            <p>Registre e acompanhe o desempenho dos alunos</p>
          </div>
          <button class="btn btn-primary" id="btn-nova-avaliacao">
            + Nova Avaliação
          </button>
        </header>

        <div class="selectors">
          <select id="select-turma" aria-label="Selecione a turma">
            <option value="">Selecione a turma</option>
          </select>
          <select id="select-disciplina" aria-label="Selecione a disciplina">
            <option value="">Selecione a disciplina</option>
          </select>
          <select id="select-bimestre" aria-label="Selecione o bimestre">
            <option value="">Selecione o bimestre</option>
            <option value="1">1º Bimestre</option>
            <option value="2">2º Bimestre</option>
            <option value="3">3º Bimestre</option>
            <option value="4">4º Bimestre</option>
          </select>
        </div>

        <div class="table-wrapper">
          <table role="grid" aria-label="Tabela de lançamento de notas">
            <thead>
              <tr>
                <th>Aluno</th>
                <th>Nota</th>
                <th>Status</th>
                <th>Observação</th>
                <th>Ação</th>
              </tr>
            </thead>
            <tbody id="tabela-notas">
              <tr>
                <td colspan="5" style="text-align: center; padding: 2rem">
                  Selecione turma, disciplina e bimestre para visualizar alunos.
                </td>
              </tr>
            </tbody>
          </table>
          <div class="rodape-tabela">
            <span>Média da Turma:</span>
            <span class="media-turma" id="media-turma">—</span>
            <button
              class="btn-salvar"
              id="btn-salvar-notas"
              style="display: none"
            >
              💾 Salvar Notas
            </button>
          </div>
        </div>
      </main>
    </div>

    <!-- Modal Nova Avaliação -->
    <div id="modal-nova-avaliacao" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h2
            style="
              font-family: &quot;Syne&quot;, sans-serif;
              font-size: 1.25rem;
              font-weight: 700;
            "
          >
            Nova Avaliação
          </h2>
          <button
            style="
              padding: 0.4rem 0.8rem;
              background: var(--surface-alt);
              border: 1px solid var(--border);
              color: var(--text);
              border-radius: 4px;
              cursor: pointer;
            "
            onclick="closeModal('modal-nova-avaliacao')"
          >
            ✕
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Nome da Avaliação</label>
            <input
              type="text"
              id="input-nome-avaliacao"
              placeholder="Ex: Prova Bimestral"
              maxlength="100"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Peso</label>
            <input
              type="number"
              id="input-peso"
              placeholder="Ex: 2"
              min="0.1"
              max="10"
              step="0.1"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Data da Aplicação</label>
            <input type="text" id="input-data-avaliacao" placeholder="dd/mm/aaaa" maxlength="10" inputmode="numeric" autocomplete="off" />
          </div>
        </div>
        <div class="modal-footer">
          <button
            style="
              padding: 0.6rem 1.25rem;
              background: var(--surface-alt);
              border: 1px solid var(--border);
              color: var(--text);
              border-radius: var(--radius);
              cursor: pointer;
            "
            onclick="closeModal('modal-nova-avaliacao')"
          >
            Cancelar
          </button>
          <button
            style="
              padding: 0.6rem 1.25rem;
              background: var(--primary);
              color: var(--bg);
              border: none;
              border-radius: var(--radius);
              cursor: pointer;
              font-weight: 600;
            "
            id="btn-criar-avaliacao"
          >
            Criar Avaliação
          </button>
        </div>
      </div>
    </div>

    <div id="toast-container"></div>

    <script type="module" src="./js/notas.js"></script>
    <script>
      (function () {
        function applyDateMask(el) {
          if (!el) return;
          el.addEventListener("keydown", function (e) {
            if (["Tab","Backspace","Delete","ArrowLeft","ArrowRight","Home","End"].includes(e.key)) return;
            if (!/\d/.test(e.key)) e.preventDefault();
          });
          el.addEventListener("input", function () {
            let v = this.value.replace(/\D/g, "").slice(0, 8);
            if (v.length > 2) v = v.slice(0, 2) + "/" + v.slice(2);
            if (v.length > 5) v = v.slice(0, 5) + "/" + v.slice(5);
            this.value = v;
          });
          el.addEventListener("blur", function () {
            const v = this.value;
            if (!v) return;
            if (v.length < 10) { this.setCustomValidity("Use dd/mm/aaaa"); this.reportValidity(); return; }
            const [d, m, y] = v.split("/").map(Number);
            const dt = new Date(y, m - 1, d);
            if (dt.getDate() !== d || dt.getMonth() + 1 !== m || dt.getFullYear() !== y) {
              this.setCustomValidity("Data inválida"); this.reportValidity();
            } else { this.setCustomValidity(""); }
          });
        }
        applyDateMask(document.getElementById("input-data-avaliacao"));
      })();
    </script>
  </body>
</html>
