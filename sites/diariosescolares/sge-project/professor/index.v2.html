<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Dashboard — Professor SGE v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              bg: "#0f172a",
              surface: "#1e293b",
              surfaceAlt: "#263148",
              border: "#334155",
              primary: "#3b82f6",
              primaryHov: "#2563eb",
              text: "#f8fafc",
              muted: "#94a3b8",
              success: "#22c55e",
              warning: "#f59e0b",
              danger: "#ef4444",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Syne", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/dashboard.v2.css" />
  </head>
  <body class="bg-bg text-text min-h-screen font-sans">
    <!-- Loading overlay (shown until auth resolves) -->
    <div
      id="loading-overlay"
      class="fixed inset-0 z-50 flex items-center justify-center bg-bg"
    >
      <div class="flex flex-col items-center gap-4">
        <div
          class="w-10 h-10 border-4 border-primary border-t-transparent rounded-full animate-spin"
        ></div>
        <p class="text-muted text-sm">Verificando sessão...</p>
      </div>
    </div>

    <!-- Main app (hidden until auth confirmed) -->
    <div id="app" class="hidden min-h-screen flex">
      <!-- ── Sidebar ───────────────────────────────────────────────────────── -->
      <aside
        id="sidebar"
        class="fixed inset-y-0 left-0 z-40 w-64 bg-surface border-r border-border flex flex-col transition-transform duration-300 md:translate-x-0 -translate-x-full"
      >
        <div class="flex items-center gap-3 px-6 py-5 border-b border-border">
          <div
            class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-white font-display font-bold text-sm"
          >
            S
          </div>
          <span class="font-display font-bold text-primary text-lg"
            >SGE v2</span
          >
        </div>

        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
          <a
            href="#"
            data-view="dashboard"
            class="nav-link active group flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all"
          >
            <span class="text-lg">📊</span><span>Dashboard</span>
          </a>
          <a
            href="chamada.html"
            class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-muted hover:bg-primary/10 hover:text-white transition-all"
          >
            <span class="text-lg">📝</span><span>Chamada</span>
          </a>
          <a
            href="notas.html"
            class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-muted hover:bg-primary/10 hover:text-white transition-all"
          >
            <span class="text-lg">🎓</span><span>Notas</span>
          </a>
          <a
            href="historico-chamadas.html"
            class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-muted hover:bg-primary/10 hover:text-white transition-all"
          >
            <span class="text-lg">📋</span><span>Histórico</span>
          </a>
          <a
            href="bilhetes.html"
            class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-muted hover:bg-primary/10 hover:text-white transition-all"
          >
            <span class="text-lg">✉️</span><span>Bilhetes</span>
            <span
              id="badge-bilhetes"
              class="ml-auto hidden bg-danger text-white text-xs font-bold rounded-full px-1.5 py-0.5 min-w-[20px] text-center"
              >0</span
            >
          </a>
          <a
            href="alunos.html"
            class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-muted hover:bg-primary/10 hover:text-white transition-all"
          >
            <span class="text-lg">👥</span><span>Alunos</span>
          </a>
          <a
            href="horario.html"
            class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-muted hover:bg-primary/10 hover:text-white transition-all"
          >
            <span class="text-lg">📅</span><span>Horários</span>
          </a>
          <a
            href="perfil.html"
            class="nav-link group flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-muted hover:bg-primary/10 hover:text-white transition-all"
          >
            <span class="text-lg">👤</span><span>Meu Perfil</span>
          </a>
        </nav>

        <div class="p-4 border-t border-border">
          <button
            id="btn-logout"
            type="button"
            class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-danger hover:bg-danger/10 transition-all"
          >
            <span class="text-lg">🚪</span><span>Sair</span>
          </button>
        </div>
      </aside>

      <!-- Sidebar backdrop (mobile) -->
      <div
        id="sidebar-backdrop"
        class="fixed inset-0 z-30 bg-black/50 hidden md:hidden"
        id="sidebar-backdrop"
      ></div>

      <!-- ── Main wrapper ───────────────────────────────────────────────────── -->
      <div class="flex-1 flex flex-col md:ml-64 min-w-0">
        <!-- ── Header ────────────────────────────────────────────────────── -->
        <header
          class="sticky top-0 z-20 bg-surface border-b border-border px-4 md:px-6 py-3 flex items-center justify-between gap-4"
        >
          <div class="flex items-center gap-3">
            <button
              id="btn-menu"
              type="button"
              class="md:hidden p-2 rounded-lg hover:bg-surfaceAlt transition"
              aria-label="Menu"
            >
              <svg
                class="w-5 h-5 text-muted"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"
                />
              </svg>
            </button>
            <div>
              <p class="text-xs text-muted" id="greeting">Carregando...</p>
              <h1
                class="text-lg font-display font-bold text-text leading-tight"
              >
                Dashboard
              </h1>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <!-- Notification bell -->
            <div class="relative">
              <button
                id="notif-bell"
                type="button"
                class="relative p-2 rounded-full hover:bg-surfaceAlt transition"
                aria-label="Notificações"
              >
                <svg
                  class="w-5 h-5 text-muted"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
                  />
                </svg>
                <span
                  id="notif-count"
                  class="hidden absolute -top-0.5 -right-0.5 bg-danger text-white text-[10px] font-bold rounded-full min-w-[16px] h-4 flex items-center justify-center px-1"
                ></span>
              </button>
              <div
                id="notif-dropdown"
                class="hidden absolute right-0 top-full mt-2 w-72 bg-surface border border-border rounded-2xl shadow-xl z-50 overflow-hidden max-h-72 overflow-y-auto"
              ></div>
            </div>

            <!-- User avatar -->
            <div class="flex items-center gap-2">
              <div
                class="w-9 h-9 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center text-white text-sm font-bold select-none"
                id="user-avatar"
              >
                P
              </div>
              <div class="hidden sm:block">
                <p
                  class="text-sm font-medium text-text leading-tight"
                  id="user-name"
                >
                  Professor
                </p>
                <p class="text-xs text-muted leading-tight" id="user-disc">—</p>
              </div>
            </div>
          </div>
        </header>

        <!-- ── Content ─────────────────────────────────────────────────── -->
        <main class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
          <!-- Stat cards -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4" id="stat-grid">
            <div class="stat-skeleton skeleton h-24 rounded-2xl"></div>
            <div class="stat-skeleton skeleton h-24 rounded-2xl"></div>
            <div class="stat-skeleton skeleton h-24 rounded-2xl"></div>
            <div class="stat-skeleton skeleton h-24 rounded-2xl"></div>
          </div>

          <!-- Turmas section -->
          <section class="bg-surface border border-border rounded-2xl p-5">
            <h2 class="font-display font-semibold text-base mb-4">
              Minhas Turmas
            </h2>
            <div
              id="turmas-list"
              class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"
            >
              <div class="skeleton h-20 rounded-xl"></div>
              <div class="skeleton h-20 rounded-xl"></div>
              <div class="skeleton h-20 rounded-xl"></div>
            </div>
          </section>

          <!-- Recent activity -->
          <section class="bg-surface border border-border rounded-2xl p-5">
            <div class="flex items-center justify-between mb-4">
              <h2 class="font-display font-semibold text-base">
                Atividade Recente
              </h2>
              <a
                href="historico-chamadas.html"
                class="text-xs text-primary hover:underline"
                >Ver tudo →</a
              >
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead>
                  <tr
                    class="text-xs text-muted uppercase tracking-wider border-b border-border"
                  >
                    <th class="text-left pb-2 font-semibold">Turma</th>
                    <th class="text-left pb-2 font-semibold">Disciplina</th>
                    <th class="text-left pb-2 font-semibold">Data</th>
                    <th class="text-left pb-2 font-semibold">Freq.</th>
                  </tr>
                </thead>
                <tbody id="activity-tbody" class="divide-y divide-border">
                  <tr>
                    <td colspan="4" class="py-4 text-center text-muted text-sm">
                      Carregando...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- Toast container -->
    <div
      id="toast-container"
      class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"
    ></div>

    <!-- Notif dropdown item template (used by JS) -->
    <template id="notif-item-tpl">
      <a
        class="block px-4 py-3 border-b border-border last:border-0 hover:bg-surfaceAlt transition text-sm text-text"
        href="#"
      >
        <p class="font-medium notif-title truncate"></p>
        <p class="text-xs text-muted notif-date mt-0.5"></p>
      </a>
    </template>

    <script type="module" src="./js/dashboard-professor.v2.js"></script>
  </body>
</html>
