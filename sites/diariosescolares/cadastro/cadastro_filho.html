<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="robots" content="noindex" />
    <title>Cadastrar Filho — SGE v2.0</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/cadastro_filho.css" />
  </head>
  <body>
    <div class="page-wrapper">
      <!-- Header -->
      <div class="page-header">
        <a href="/pai/pai_index.html" class="back-btn"> ← Voltar </a>
        <div class="page-title-block">
          <h1>Cadastrar Filho</h1>
          <p>Preencha os dados para vincular um aluno à sua conta</p>
        </div>
      </div>

      <!-- Card -->
      <div class="card">
        <form id="form-filho" novalidate>
          <!-- Seção 1: Identificação -->
          <p class="section-title">Identificação do Aluno</p>
          <div class="form-body">
            <div class="form-row">
              <div class="field">
                <label for="nome-aluno">Nome Completo</label>
                <input
                  type="text"
                  id="nome-aluno"
                  placeholder="Ex: Ana Clara Silva"
                  minlength="3"
                  maxlength="100"
                  autocomplete="off"
                  required
                />
                <span class="field-error" data-field="nome-aluno"></span>
              </div>
            </div>

            <div class="form-row cols-2">
              <div class="field">
                <label for="data-nascimento">Data de Nascimento</label>
                <input
                  type="text"
                  id="data-nascimento"
                  placeholder="dd/mm/aaaa"
                  maxlength="10"
                  inputmode="numeric"
                  autocomplete="off"
                  required
                />
                <span class="field-error" data-field="data-nascimento"></span>
              </div>

              <div class="field">
                <label for="matricula">Matrícula</label>
                <input
                  type="text"
                  id="matricula"
                  placeholder="Ex: 2024001234"
                  maxlength="20"
                  autocomplete="off"
                  required
                />
                <span class="field-hint">Fornecida pela secretaria</span>
                <span class="field-error" data-field="matricula"></span>
              </div>
            </div>
          </div>

          <!-- Seção 2: Dados Escolares -->
          <div class="section-gap">
            <p class="section-title">Dados Escolares</p>
          </div>
          <div class="form-body">
            <div class="form-row">
              <div class="field">
                <label for="turma">Turma</label>
                <select id="turma" required>
                  <option value="">Selecione...</option>
                  <optgroup label="Ensino Fundamental I">
                    <option value="1A">1º Ano A</option>
                    <option value="1B">1º Ano B</option>
                    <option value="1C">1º Ano C</option>
                    <option value="2A">2º Ano A</option>
                    <option value="2B">2º Ano B</option>
                    <option value="2C">2º Ano C</option>
                    <option value="3A">3º Ano A</option>
                    <option value="3B">3º Ano B</option>
                    <option value="3C">3º Ano C</option>
                    <option value="4A">4º Ano A</option>
                    <option value="4B">4º Ano B</option>
                    <option value="4C">4º Ano C</option>
                    <option value="5A">5º Ano A</option>
                    <option value="5B">5º Ano B</option>
                    <option value="5C">5º Ano C</option>
                  </optgroup>
                  <optgroup label="Ensino Fundamental II">
                    <option value="6A">6º Ano A</option>
                    <option value="6B">6º Ano B</option>
                    <option value="6C">6º Ano C</option>
                    <option value="7A">7º Ano A</option>
                    <option value="7B">7º Ano B</option>
                    <option value="7C">7º Ano C</option>
                    <option value="8A">8º Ano A</option>
                    <option value="8B">8º Ano B</option>
                    <option value="8C">8º Ano C</option>
                    <option value="9A">9º Ano A</option>
                    <option value="9B">9º Ano B</option>
                    <option value="9C">9º Ano C</option>
                  </optgroup>
                  <optgroup label="Ensino Médio">
                    <option value="1MA">1º Médio A</option>
                    <option value="1MB">1º Médio B</option>
                    <option value="1MC">1º Médio C</option>
                    <option value="2MA">2º Médio A</option>
                    <option value="2MB">2º Médio B</option>
                    <option value="2MC">2º Médio C</option>
                    <option value="3MA">3º Médio A</option>
                    <option value="3MB">3º Médio B</option>
                    <option value="3MC">3º Médio C</option>
                  </optgroup>
                </select>
                <span class="field-error" data-field="turma"></span>
              </div>
            </div>

            <div class="form-row cols-2">
              <div class="field">
                <label for="turno">Turno</label>
                <select id="turno" required>
                  <option value="">Selecione...</option>
                  <option value="manha">Manhã (07:00–12:00)</option>
                  <option value="tarde">Tarde (13:00–17:30)</option>
                  <option value="noite">Noite (19:00–22:00)</option>
                </select>
                <span class="field-error" data-field="turno"></span>
              </div>

              <div class="field">
                <label for="periodo">Período de Início</label>
                <select id="periodo" required>
                  <option value="">Selecione...</option>
                  <option value="1bi">1º Bimestre</option>
                  <option value="2bi">2º Bimestre</option>
                  <option value="3bi">3º Bimestre</option>
                  <option value="4bi">4º Bimestre</option>
                </select>
                <span class="field-error" data-field="periodo"></span>
              </div>
            </div>
          </div>

          <!-- Actions -->
          <div class="form-actions">
            <button type="submit" id="btn-submit" class="btn-primary">
              Cadastrar Filho
            </button>
            <a href="/pai/pai_index.html" class="btn-secondary">Cancelar</a>
          </div>

          <div id="feedback" class="feedback"></div>
        </form>
      </div>
    </div>

    <script type="module" src="js/cadastro_filho.js"></script>
  </body>
</html>
