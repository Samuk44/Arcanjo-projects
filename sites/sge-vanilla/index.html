<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestão Escolar - Responsáveis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h1 class="logo">SGE</h1>
        <p class="logo-subtitle">Gestão Escolar</p>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item" data-page="notifications">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span>Notificações</span>
          <span class="badge" id="notificationBadge" style="display: none;">2</span>
        </button>
        <button class="nav-item" data-page="profile">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>Meu Perfil</span>
        </button>
        <button class="nav-item" data-page="documents">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
            <polyline points="13 2 13 9 20 9"></polyline>
          </svg>
          <span>Documentos</span>
        </button>
        <button class="nav-item" data-page="calendar">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span>Calendário</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button class="logout-btn">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Sair
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Header -->
      <header class="header">
        <button class="menu-toggle" id="menuToggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <h2 class="header-title">Bem-vindo, Responsável!</h2>

        <div class="header-actions">
          <button class="notification-btn" id="notificationBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="badge" id="headerBadge" style="display: none;">2</span>
          </button>
        </div>
      </header>

      <!-- Content Area -->
      <main class="content">
        <!-- Hero Section -->
        <section class="hero-section">
          <img src="https://d2xsxph8kpxj0f.cloudfront.net/310519663644445708/kBzKFVS3bUjiq4ChdzuRX6/hero-responsavel-sge-5P8qHtzPUuWPKpbyqvyvYT.webp" alt="Responsável acompanhando filhos" class="hero-image">
        </section>

        <!-- Children Cards -->
        <section class="children-section">
          <h3 class="section-title">Seus Filhos</h3>
          <div class="children-grid" id="childrenGrid">
            <!-- Preenchido por JavaScript -->
          </div>
        </section>

        <!-- Notifications Feed -->
        <section class="notifications-section">
          <div class="section-header">
            <h3 class="section-title" id="notificationsTitle">Notificações de Todos</h3>
          </div>
          <div class="notifications-list" id="notificationsList">
            <!-- Preenchido por JavaScript -->
          </div>
        </section>

        <!-- Stats -->
        <section class="stats-section">
          <h3 class="section-title">Resumo Geral</h3>
          <div class="stats-grid" id="statsGrid">
            <!-- Preenchido por JavaScript -->
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-header-content">
          <div class="modal-icon" id="modalIcon"></div>
          <div>
            <h2 class="modal-title" id="modalTitle"></h2>
            <p class="modal-subtitle" id="modalSubtitle"></p>
          </div>
        </div>
        <button class="modal-close" id="modalClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Preenchido por JavaScript -->
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
