# ──────────────────────────────────────────────────────────────
# Dependências a adicionar/verificar no seu pubspec.yaml
# ──────────────────────────────────────────────────────────────
#
# Cole o bloco abaixo dentro de "dependencies:" no seu pubspec.yaml
# e rode: flutter pub get
#
# dependencies:
#   flutter:
#     sdk: flutter
#
#   # Firebase
#   firebase_core: ^3.6.0
#   firebase_auth: ^5.3.1
#   firebase_database: ^11.1.4
#   firebase_storage: ^12.3.2
#
#   # Imagem de perfil
#   image_picker: ^1.1.2
#
# ──────────────────────────────────────────────────────────────
# Permissões necessárias
# ──────────────────────────────────────────────────────────────
#
# Android (android/app/src/main/AndroidManifest.xml):
#   <uses-permission android:name="android.permission.CAMERA"/>
#   <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
#   <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
#
# iOS (ios/Runner/Info.plist):
#   <key>NSCameraUsageDescription</key>
#   <string>Usamos a câmera para foto de perfil.</string>
#   <key>NSPhotoLibraryUsageDescription</key>
#   <string>Usamos a galeria para foto de perfil.</string>
